<style>
.dash-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dash-filter{min-width:180px;border:1px solid var(--ym-line);border-radius:10px;background:#fff;color:var(--ym-navy);padding:9px 10px;font-size:10px;font-weight:700}.dash-grid{display:grid;gap:12px}.dash-kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin:18px 0}.dash-kpi{background:#fff;border:1px solid var(--ym-line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}.dash-kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--ym-indigo)}.dash-kpi.orange:before{background:#FF8A1F}.dash-kpi.green:before{background:#137A5B}.dash-kpi b{font:800 25px Montserrat;color:var(--ym-navy);display:block}.dash-kpi span{font-size:10px;color:var(--ym-muted)}.dash-kpi small{display:block;font-size:8.5px;color:#72869A;margin-top:3px}.dash-kpi[data-detail]{cursor:pointer;transition:.15s}.dash-kpi[data-detail]:hover{transform:translateY(-1px);box-shadow:0 9px 25px rgba(15,42,67,.09);border-color:#C8D7E7}.dash-kpi[data-detail]:after{content:'Ver registros →';display:block;margin-top:7px;font-size:7.5px;font-weight:800;color:#484DCF;text-transform:uppercase;letter-spacing:.04em}.dash-section{margin-top:18px}.dash-section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:9px}.dash-section-head h2{font:800 17px Montserrat;color:var(--ym-navy);margin:0}.dash-section-head p{font-size:10px;color:var(--ym-muted);margin:3px 0 0}.dash-card{background:#fff;border:1px solid var(--ym-line);border-radius:16px;padding:14px;box-shadow:0 7px 22px rgba(15,42,67,.05)}.dash-two{grid-template-columns:1.15fr .85fr}.dash-three{grid-template-columns:repeat(3,minmax(0,1fr))}.funnel{display:grid;gap:9px}.funnel-row{display:grid;grid-template-columns:150px 1fr 110px;gap:9px;align-items:center}.funnel-label{font-size:10px;font-weight:800;color:var(--ym-navy)}.funnel-track{height:18px;background:#EEF3F8;border-radius:999px;overflow:hidden}.funnel-fill{height:100%;min-width:2px;border-radius:999px;background:linear-gradient(90deg,#484DCF,#0066FF)}.funnel-value{text-align:right;font-size:9.5px;color:var(--ym-muted)}.funnel-value b{color:var(--ym-navy)}.mini-table{width:100%;border-collapse:collapse}.mini-table th{text-align:left;font-size:8px;text-transform:uppercase;letter-spacing:.04em;color:#73879A;padding:7px 6px;border-bottom:1px solid #E6EDF4}.mini-table td{font-size:9.5px;color:#496176;padding:8px 6px;border-bottom:1px solid #EEF3F7;vertical-align:top}.mini-table td b{color:var(--ym-navy)}.rank-bar{height:6px;background:#EDF2F7;border-radius:999px;overflow:hidden;margin-top:4px}.rank-bar i{display:block;height:100%;background:#484DCF;border-radius:999px}.empty{padding:22px;text-align:center;border:1px dashed #CCD8E4;border-radius:12px;color:var(--ym-muted);font-size:10px}.gate{border-radius:13px;padding:12px;border:1px solid #E8D7B0;background:#FFF8E9}.gate.ok{border-color:#CDE9DC;background:#F0FAF5}.gate b{display:block;color:var(--ym-navy);font:800 11px Montserrat;margin-bottom:4px}.gate span{font-size:9.5px;line-height:1.5;color:#61758A}.motor-grid{grid-template-columns:1.05fr .95fr}.p8-row{display:grid;grid-template-columns:minmax(120px,1fr) repeat(4,64px);gap:7px;padding:8px 0;border-bottom:1px solid #EDF2F6;align-items:center}.p8-row:first-child{font-size:8px;text-transform:uppercase;color:#7B8DA0;font-weight:800}.p8-row:not(:first-child){font-size:9.5px;color:#526A7E}.p8-row b{color:var(--ym-navy)}.pill-list{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:6px 8px;border-radius:999px;background:#EEF3F9;color:#496176;font-size:8.5px;font-weight:700}.pill b{color:var(--ym-navy)}.recent-case{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #EDF2F6}.recent-case b{font-size:9.5px;color:var(--ym-navy)}.recent-case span{font-size:8.5px;color:var(--ym-muted)}.section-divider{height:1px;background:#DDE6F0;margin:24px 0}.loading{padding:36px;text-align:center;color:var(--ym-muted);font-size:11px}.error{background:#FFF1F0;border:1px solid #F0CBC7;color:#9D2A22;padding:12px;border-radius:12px;font-size:10px}.num{font-variant-numeric:tabular-nums}.money{white-space:nowrap}.updated{font-size:9px;color:var(--ym-muted)}.dash-modal-back{position:fixed;inset:0;background:rgba(4,22,38,.66);z-index:500;display:grid;place-items:center;padding:18px}.dash-modal{width:min(900px,100%);max-height:90vh;background:#F8FAFD;border-radius:20px;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.27)}.dash-modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;background:#0A2540;color:#fff}.dash-modal header h3{font:800 14px Montserrat;margin:0}.dash-modal header button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;width:31px;height:31px;font-size:19px;cursor:pointer}.dash-modal-body{padding:14px;overflow:auto;max-height:calc(90vh - 60px)}.detail-row{display:grid;grid-template-columns:1.35fr .8fr .8fr .8fr;gap:8px;padding:9px;border-bottom:1px solid #E6EDF4;background:#fff}.detail-row:first-child{border-radius:10px 10px 0 0}.detail-row b{font-size:9.5px;color:var(--ym-navy)}.detail-row span{font-size:8.8px;color:var(--ym-muted)}
@media(max-width:1100px){.dash-kpis{grid-template-columns:repeat(3,1fr)}.dash-two,.dash-three,.motor-grid{grid-template-columns:1fr}.funnel-row{grid-template-columns:130px 1fr 90px}}
@media(max-width:760px){.dash-kpis{grid-template-columns:repeat(2,1fr)}.funnel-row{grid-template-columns:105px 1fr 70px}.p8-row{grid-template-columns:minmax(100px,1fr) repeat(4,48px);gap:4px}.dash-section-head{align-items:flex-start;flex-direction:column}.dash-filter{width:100%}.detail-row{grid-template-columns:1fr 1fr}}
</style><link rel="stylesheet" href="/assets/internal-mobile-system.css?v=20260901-typography2"></head><body>
<div class="ym-main"><header class="ym-topbar"><div style="display:flex;align-items:center;gap:10px"><button id="ymMenu" class="ym-mobile-toggle">☰</button><div class="ym-topbar-title">DASHBOARD GERENCIAL</div></div><div class="ym-topbar-meta"><span class="ym-chip stage">LEITURA GERENCIAL</span><span id="dashContract" class="ym-chip">Carregando…</span></div></header>
<main class="ym-content"><div class="ym-header"><div><div class="ym-eyebrow">ETAPA 2 · YM_DASHBOARD_GERENCIAL</div><h1 class="ym-title">Visão do negócio</h1><p class="ym-lead">Comercial, clientes e inteligência do MOTOR no mesmo lugar — sem transformar correlação em recomendação automática.</p></div><div class="ym-actions"><select id="period" class="dash-filter" aria-label="Período do Dashboard"><option value="ALL">Todo o histórico</option><option value="D30">Últimos 30 dias</option><option value="D90">Últimos 90 dias</option><option value="D180">Últimos 180 dias</option><option value="D365">Últimos 365 dias</option></select><a class="ym-btn secondary" href="/CRM">Abrir CRM</a><a class="ym-btn secondary" href="/MOTOR">Abrir MOTOR</a><button id="refresh" class="ym-btn">Atualizar</button></div></div>
<div id="dashRoot"><div class="loading">Carregando indicadores gerenciais…</div></div>
</main></div>
<script src="/assets/internal-shell.js?v=20260901-typography2"></script><script>
const root=document.getElementById('dashRoot');const E=v=>window.YM?.esc?YM.esc(v):String(v??'');let activeSession=null;
const pct=v=>v==null?'—':`${Number(v).toFixed(1).replace('.',',')}%`;const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const date=v=>{if(!v)return '—';try{return new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}catch{return '—'}};
function injectDashboardNav(){const nav=document.querySelector('.ym-nav');if(!nav||nav.querySelector('a[href="/DASHBOARD"]'))return;const groups=nav.querySelectorAll('.ym-nav-group');const g=groups[groups.length-1];if(!g)return;const a=document.createElement('a');a.href='/DASHBOARD';a.className='active';a.innerHTML='<span class="nav-icon">D</span><span>Dashboard</span>';const motor=[...g.querySelectorAll('a')].find(x=>x.getAttribute('href')==='/MOTOR');motor?.after(a)}
function barWidth(n,total){return total>0?Math.max(1,Math.round((n/total)*100)):0}
function funnelRow(label,n,total,rateLabel=''){return `<div class="funnel-row"><div class="funnel-label">${E(label)}</div><div class="funnel-track"><div class="funnel-fill" style="width:${barWidth(n,total)}%"></div></div><div class="funnel-value"><b>${n}</b>${rateLabel?` · ${E(rateLabel)}`:''}</div></div>`}
function dimensionTable(title,rows,limit=8){rows=(rows||[]).slice(0,limit);if(!rows.length)return `<div class="dash-card"><b style="font:800 11px Montserrat;color:var(--ym-navy)">${E(title)}</b><div class="empty" style="margin-top:10px">Sem dados suficientes.</div></div>`;const max=Math.max(...rows.map(x=>x.total||0),1);return `<div class="dash-card"><b style="font:800 11px Montserrat;color:var(--ym-navy)">${E(title)}</b><table class="mini-table" style="margin-top:7px"><thead><tr><th>Grupo</th><th>Total</th><th>Leitura</th><th>Raio-X</th><th>Venda</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${E(r.label)}</b><div class="rank-bar"><i style="width:${Math.round((r.total/max)*100)}%"></i></div></td><td>${r.total}</td><td>${r.reading_sent} <span class="updated">(${pct(r.reading_rate)})</span></td><td>${r.raiox_paid}</td><td>${r.won}</td></tr>`).join('')}</tbody></table></div>`}
function countList(items,empty='Sem registros ainda.'){if(!items?.length)return `<div class="empty">${E(empty)}</div>`;return `<div class="pill-list">${items.slice(0,12).map(x=>`<span class="pill">${E(x.label)} · <b>${x.count}</b></span>`).join('')}</div>`}
function segmentGroup(label){const s=String(label||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();if(!s)return 'Não informado';if(/(^|[^a-z])rh([^a-z]|$)|recursos humanos|dho|recrut|selecao|gestao de pessoas|desenvolvimento humano|desenvolvimento organizacional|talent acquisition|talentos|psicologia do trabalho|cultura e clima|desenvolvimento de pessoas/.test(s))return 'Consultoria de RH';if(/negocio digital|infoprod|creator|comunidade e cursos|mentoria/.test(s))return 'Negócios digitais / Infoprodutos';if(/clinica|odontolog|estetica|cirurgia plastica|medica \/ estetica/.test(s))return 'Saúde / Estética / Odonto';if(/imobili|incorporadora/.test(s))return 'Imobiliário';if(/educacao|treinamento|edtech|idiomas corporativos|business school|team building|lideranca|carreira|coaching/.test(s))return 'Educação / Treinamento';if(/saas|tecnologia|software|crm|automacao whatsapp|omnichannel|healthtech|proptech|ia para receita|fiscal/.test(s))return 'SaaS / Tecnologia';if(/distribu|atacado|e-commerce|marcas proprias/.test(s))return 'Distribuição / E-commerce';if(/bpo|contab|financeir|controladoria|valuation/.test(s))return 'Financeiro / BPO / Contábil';if(/customer experience|customer success|(^|[^a-z])cx([^a-z]|$)|cs ops|(^|[^a-z])cs([^a-z]|$)/.test(s))return 'CX / Customer Success';if(/vendas|comercial|hunting/.test(s))return 'Comercial / Vendas';if(/consultoria|gestao|estrategia|processos|governanca|planejamento|facilitacao/.test(s))return 'Consultoria Empresarial';return 'Outros'}
function aggregateSegments(rows){const m=new Map();for(const r of rows||[]){const label=segmentGroup(r.label),cur=m.get(label)||{label,total:0,reading_sent:0,raiox_paid:0,raiox_delivered:0,won:0,lost:0};for(const k of ['total','reading_sent','raiox_paid','raiox_delivered','won','lost'])cur[k]+=Number(r?.[k]||0);m.set(label,cur)}return [...m.values()].map(r=>({...r,reading_rate:r.total?Number(((r.reading_sent/r.total)*100).toFixed(1)):null,raiox_rate_from_reading:r.reading_sent?Number(((r.raiox_paid/r.reading_sent)*100).toFixed(1)):null,won_rate:r.total?Number(((r.won/r.total)*100).toFixed(1)):null})).sort((a,b)=>b.total-a.total||a.label.localeCompare(b.label,'pt-BR'))}
function render(data){const c=data.commercial||{},f=c.funnel||{},cl=data.clients||{},fin=cl.financial||{},m=data.motor||{},total=f.total||0,scope=data.filters?.label||'Todo período';document.getElementById('dashContract').textContent=data.contract_version||'Dashboard';root.innerHTML=`<div class="dash-status"><span class="ym-chip">${E(scope)}</span><span class="updated">Atualizado em ${date(data.generated_at)}</span></div><div class="dash-grid dash-kpis"><div class="dash-kpi" data-detail="TOTAL"><b class="num">${total}</b><span>Oportunidades</span><small>Criadas em ${E(scope.toLowerCase())}</small></div><div class="dash-kpi" data-detail="READING"><b class="num">${f.reading_sent||0}</b><span>Leituras enviadas</span><small>${pct(f.rates?.reading_over_total)} das oportunidades do período</small></div><div class="dash-kpi orange" data-detail="RAIOX_PAID"><b class="num">${f.raiox_paid||0}</b><span>Raio-X pagos</span><small>${pct(f.rates?.paid_over_reading)} das leituras</small></div><div class="dash-kpi" data-detail="RAIOX_DELIVERED"><b class="num">${f.raiox_delivered||0}</b><span>Raio-X entregues</span><small>${pct(f.rates?.delivered_over_paid)} dos pagos</small></div><div class="dash-kpi green" data-detail="WON"><b class="num">${f.won||0}</b><span>Serviços contratados</span><small>${pct(f.rates?.won_over_total)} das oportunidades do período</small></div></div>
<section class="dash-section"><div class="dash-section-head"><div><h2>Funil comercial</h2><p>O mesmo marco explícito usado pelo CRM. Escopo: ${E(scope)}.</p></div></div><div class="dash-card funnel">${funnelRow('Oportunidades',total,total)}${funnelRow('Leitura enviada',f.reading_sent||0,total,pct(f.rates?.reading_over_total))}${funnelRow('Raio-X pago',f.raiox_paid||0,total,pct(f.rates?.paid_over_reading))}${funnelRow('Raio-X entregue',f.raiox_delivered||0,total,pct(f.rates?.delivered_over_paid))}${funnelRow('Serviço contratado',f.won||0,total,pct(f.rates?.won_over_total))}</div></section>
<section class="dash-section"><div class="dash-section-head"><div><h2>Onde o comercial responde melhor</h2><p>Volume e avanço por segmento, origem e classe — sempre com denominador visível.</p></div></div><div class="dash-grid dash-three">${dimensionTable('Por segmento',aggregateSegments(c.by_segment),20)}${dimensionTable('Por origem',c.by_source)}${dimensionTable('Por classe de lead',c.by_lead_class)}</div></section>
<section class="dash-section"><div class="dash-grid dash-two"><div class="dash-card"><b style="font:800 11px Montserrat;color:var(--ym-navy)">Motivos de perda</b><div style="margin-top:10px">${countList(c.loss_reasons,'Ainda não existem oportunidades perdidas com motivo registrado neste período.')}</div></div><div class="dash-card"><b style="font:800 11px Montserrat;color:var(--ym-navy)">Rotas humanas validadas</b><div style="margin-top:10px">${countList(c.human_routes,'Ainda não há rotas humanas validadas neste período.')}</div></div></div></section>
<div class="section-divider"></div><section class="dash-section"><div class="dash-section-head"><div><h2>Clientes e receita registrada</h2><p>Movimento de ${E(scope.toLowerCase())}; recorrência ativa mostra a fotografia atual.</p></div></div><div class="dash-grid dash-kpis"><div class="dash-kpi"><b>${cl.active||0}</b><span>Clientes ativos agora</span><small>${cl.new_in_period||0} novo(s) no período · ${cl.total||0} no histórico</small></div><div class="dash-kpi"><b>${cl.services_total||0}</b><span>Serviços registrados</span><small>No período selecionado</small></div><div class="dash-kpi orange"><b class="money">${money(fin.contracted_value)}</b><span>Valor contratado</span><small>No período selecionado</small></div><div class="dash-kpi"><b class="money">${money(fin.monthly_recurring_value)}</b><span>Recorrência mensal ativa</span><small>Fotografia atual, independentemente do período</small></div><div class="dash-kpi green"><b class="money">${money(fin.received_value)}</b><span>Recebido registrado</span><small>Pagamentos PAGO no período</small></div></div><div class="dash-card"><b style="font:800 11px Montserrat;color:var(--ym-navy)">Mix de serviços do período</b><div style="margin-top:10px">${countList(cl.service_mix,'Ainda não há serviços suficientes para compor o mix neste período.')}</div></div></section>
<div class="section-divider"></div><section class="dash-section"><div class="dash-section-head"><div><h2>Inteligência MOTOR VOS</h2><p>Casos criados em ${E(scope.toLowerCase())}. Nenhum bloco abaixo recomenda produto automaticamente.</p></div></div><div class="dash-grid motor-grid"><div class="dash-card"><div class="gate ${m.pattern_gate?.status==='AMOSTRA_HABILITADA'?'ok':''}"><b>${m.pattern_gate?.status==='AMOSTRA_HABILITADA'?'Amostra habilitada para padrões':'Base ainda insuficiente para padrão'}</b><span>${m.pattern_gate?.validated_cases||0} caso(s) validados de um mínimo de ${m.pattern_gate?.minimum_cases||5}. Correlações só aparecem depois desse gate.</span></div><div style="margin-top:13px"><b style="font:800 11px Montserrat;color:var(--ym-navy)">8Ps observados</b><div class="p8-row"><span>Pilar</span><span>Ativo</span><span>Disfunção</span><span>Lacuna</span><span>Inconcl.</span></div>${(m.p8_patterns||[]).map(r=>`<div class="p8-row"><b>${E(r.label||r.code)}</b><span>${r.ATIVO||0}</span><span>${r.DISFUNCAO||0}</span><span>${r.LACUNA||0}</span><span>${r.INCONCLUSIVO||0}</span></div>`).join('')||'<div class="empty">Ainda sem leitura de 8Ps consolidada neste período.</div>'}</div></div><div class="dash-card"><b style="font:800 11px Montserrat;color:var(--ym-navy)">Estado do MOTOR</b><div style="margin:10px 0">${countList(m.case_status,'Sem casos no MOTOR neste período.')}</div><b style="font:800 10px Montserrat;color:var(--ym-navy)">Hipóteses</b><div style="margin:7px 0 12px">${countList(m.hypothesis_status,'Sem hipóteses registradas.')}</div><b style="font:800 10px Montserrat;color:var(--ym-navy)">Conclusões</b><div style="margin:7px 0 12px">${countList(m.conclusion_types,'Sem conclusões registradas.')}</div><b style="font:800 10px Montserrat;color:var(--ym-navy)">Ordenação humana</b><div style="margin-top:7px">${countList(m.order_status,'Sem ações ordenadas ainda.')}</div></div></div></section>
<section class="dash-section"><div class="dash-grid dash-two"><div class="dash-card"><b style="font:800 11px Montserrat;color:var(--ym-navy)">Correlações entre 8Ps</b><div style="margin-top:10px">${m.pattern_gate?.status==='AMOSTRA_HABILITADA'?countList((m.correlations||[]).map(x=>({label:x.pair,count:x.count})),'Nenhuma correlação recorrente atingiu o mínimo.'): '<div class="empty">Este bloco será liberado quando houver casos humanos validados suficientes no período.</div>'}</div></div><div class="dash-card"><b style="font:800 11px Montserrat;color:var(--ym-navy)">Serviços após análise</b><p class="updated">Histórico de decisões humanas posteriores ao diagnóstico — não é indicação automática do MOTOR.</p><div style="margin-top:8px">${countList(m.historical_post_analysis_services,'Ainda não existe histórico suficiente para esta leitura.')}</div></div></div></section>
<section class="dash-section"><div class="dash-card"><div class="dash-section-head"><div><h2 style="font-size:13px">Casos recentes</h2><p>${m.cases_total||0} caso(s) no período · ${m.pending_intakes||0} Raio-X pendente(s) de vínculo na base</p></div></div>${(m.recent_cases||[]).length?(m.recent_cases||[]).map(x=>`<div class="recent-case"><div><b>${E(x.business_name||'Caso sem nome')}</b><br><span>${E(x.status||'—')}</span></div><span>${date(x.updated_at)}</span></div>`).join(''):'<div class="empty">Nenhum caso recente.</div>'}</div></section>`}
function detailTitle(key){return{TOTAL:'Oportunidades',READING:'Leituras enviadas',RAIOX_PAID:'Raio-X pagos',RAIOX_DELIVERED:'Raio-X entregues',WON:'Serviços contratados'}[key]||'Registros'}
async function drill(key){if(!activeSession)return;document.getElementById('dashModal')?.remove();const m=document.createElement('div');m.id='dashModal';m.innerHTML=`<div class="dash-modal-back"><section class="dash-modal"><header><h3>${E(detailTitle(key))}</h3><button type="button">×</button></header><div class="dash-modal-body"><div class="loading">Carregando registros…</div></div></section></div>`;document.body.append(m);m.querySelector('button').onclick=()=>m.remove();m.querySelector('.dash-modal-back').onclick=e=>{if(e.target===e.currentTarget)m.remove()};try{const period=document.getElementById('period').value||'ALL';const r=await fetch(YM.SUPABASE_URL+'/functions/v1/motor-dashboard?period='+encodeURIComponent(period)+'&detail='+encodeURIComponent(key),{headers:{Authorization:'Bearer '+activeSession.access_token,apikey:YM.PUBLISHABLE_KEY}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha ao carregar registros');const body=m.querySelector('.dash-modal-body');body.innerHTML=(j.rows||[]).length?(j.rows||[]).map(x=>`<div class="detail-row"><div><b>${E(x.business_name)}</b><br><span>${E(x.name||'')}</span></div><div><b>${E(x.segment||'Sem segmento')}</b><br><span>${E(x.lead_class||'Sem classe')}</span></div><div><b>${E(x.source||'Sem origem')}</b><br><span>${E(x.current_stage||'—')}</span></div><div><b>${date(x.initial_reading_date||x.won_at||x.created_at)}</b><br><span>Data de referência</span></div></div>`).join(''):'<div class="empty">Nenhum registro neste recorte.</div>'}catch(e){m.querySelector('.dash-modal-body').innerHTML=`<div class="error">${E(e.message||e)}</div>`}}
async function load(){const btn=document.getElementById('refresh');btn.disabled=true;btn.textContent='Atualizando…';try{const session=await YM.requireSession('/CRM');if(!session)return;activeSession=session;YM.shell('DASHBOARD',session.user);injectDashboardNav();const period=document.getElementById('period').value||'ALL';const r=await fetch(YM.SUPABASE_URL+'/functions/v1/motor-dashboard?period='+encodeURIComponent(period),{headers:{Authorization:'Bearer '+session.access_token,apikey:YM.PUBLISHABLE_KEY}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha ao carregar o Dashboard');render(j)}catch(e){root.innerHTML=`<div class="error">${E(e.message||e)}</div>`}finally{btn.disabled=false;btn.textContent='Atualizar'}}
document.getElementById('refresh').onclick=load;document.getElementById('period').onchange=load;root.addEventListener('click',e=>{const card=e.target.closest?.('.dash-kpi[data-detail]');if(card)drill(card.dataset.detail)});load();
</script><script src="/assets/internal-typography-guard.js?v=20260901-2"></script></body></html>
