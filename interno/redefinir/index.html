<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Definir senha — YM</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/assets/internal-shell.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#eef3f9,#eef0ff)}.box{width:min(500px,100%);background:#fff;border:1px solid var(--ym-line);border-radius:22px;padding:34px;box-shadow:var(--ym-shadow)}.box img{width:170px;margin-bottom:24px}.box h1{font:800 27px Montserrat;color:var(--ym-navy);margin:6px 0}.box p{font-size:12px;line-height:1.6;color:var(--ym-muted)}.msg{display:none;padding:10px 12px;border-radius:9px;font-size:11px;margin:12px 0;background:#eef6ff;color:#245e9d}.msg.err{background:#fff1f0;color:#b42318}</style></head><body><div class="box"><img src="/assets/img/logo-ym-horizontal.webp" alt="YM"><div class="ym-eyebrow">ÁREA INTERNA · PRODUÇÃO ASSISTIDA</div><h1>Definir sua senha</h1><p id="intro">Crie a senha usada para entrar no CRM, MOTOR e Identidade. A mesma sessão vale para os três módulos.</p><div id="msg" class="msg"></div><div id="form" class="ym-hidden"><label class="ym-label">Nova senha</label><input id="p1" class="ym-input" type="password" autocomplete="new-password"><label class="ym-label">Confirme a senha</label><input id="p2" class="ym-input" type="password" autocomplete="new-password"><p style="font-size:10px">Use pelo menos 8 caracteres.</p><button id="save" class="ym-btn" style="width:100%;margin-top:8px">Salvar senha e entrar</button></div></div><script>const SUPABASE_URL='https://srzdikgztpdtwbggwniz.supabase.co',PUBLISHABLE_KEY='sb_publishable_OGZsWJSj2noU3Dd78pk48g__eEKE3xT';const rc=window.supabase.createClient(SUPABASE_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const q=new URLSearchParams(location.search),next=/^\/(CRM|MOTOR|Identidade)(?:[/?#]|$)/.test(q.get('next')||'')?q.get('next'):'/CRM',change=q.get('change')==='1',msg=document.getElementById('msg'),form=document.getElementById('form');function show(t,e=false){msg.textContent=t;msg.className='msg'+(e?' err':'');msg.style.display='block'}function ready(){form.classList.remove('ym-hidden');show(change?'Sessão confirmada. Defina sua nova senha.':'Link validado. Agora defina sua senha.')}async function boot(){let handled=false;rc.auth.onAuthStateChange((event,session)=>{if(session&&!handled){handled=true;ready()}});await new Promise(r=>setTimeout(r,250));const {data:{session}}=await rc.auth.getSession();if(session&&!handled){handled=true;ready();return}if(!session){show('Abra o link de recuperação recebido por e-mail. Se ele expirou, volte ao login e solicite outro.',true)}}async function save(){const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1.length<8)return show('A senha precisa ter pelo menos 8 caracteres.',true);if(p1!==p2)return show('As duas senhas precisam ser iguais.',true);const b=document.getElementById('save');b.disabled=true;b.textContent='Salvando…';const {error}=await rc.auth.updateUser({password:p1});b.disabled=false;b.textContent='Salvar senha e entrar';if(error)return show('Não foi possível salvar a senha. Solicite um novo link e tente novamente.',true);show('Senha salva. Abrindo a área interna…');setTimeout(()=>location.replace(next),500)}document.getElementById('save').onclick=save;boot();</script></body></html>
