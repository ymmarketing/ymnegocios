<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b2d">
  <meta name="robots" content="noindex,nofollow">
  <title>Minha jornada — Menos Bucho</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap"><div class="brand-mark">MB</div><div><strong>MENOS BUCHO</strong><small>MINHA JORNADA</small></div></div>
    <button id="signOutButton" class="ghost-btn" type="button">Sair</button>

  <main id="journeyApp" class="app-shell" aria-live="polite">
    <section class="panel loading-panel"><div class="loader-dot"></div><strong>Carregando sua jornada…</strong></section>
  </main>

  <footer class="footer"><span>Desenvolvido pela YM Marketing & Negócios</span><span>•</span><span>Hábitos sustentáveis, no seu ritmo.</span></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./assets/journey.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  </script>
</body>
</html>
