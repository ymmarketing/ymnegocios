<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Financeiro — YM Marketing & Negócios</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/assets/internal-shell.css">
<style>
.fin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fin-card{background:#fff;border:1px solid var(--ym-line);border-radius:15px;padding:14px;box-shadow:0 8px 22px rgba(15,42,67,.05)}.fin-card .k{font:700 8.5px Montserrat;color:var(--ym-muted);text-transform:uppercase;letter-spacing:.08em}.fin-card .v{font:800 23px Montserrat;color:var(--ym-navy);margin-top:6px}.fin-card .s{font-size:8.8px;color:var(--ym-muted);margin-top:5px;line-height:1.4}.fin-card.primary{background:linear-gradient(135deg,#0A2540,#174C78);border:0}.fin-card.primary .k,.fin-card.primary .s{color:#C8D8E8}.fin-card.primary .v{color:#fff}.fin-card.indigo{background:#F3F3FF;border-color:#DADCF7}.fin-card.orange{background:#FFF8EB;border-color:#F2DFB8}.fin-card.green{background:#F1FAF6;border-color:#D5EDE1}.fin-section{background:#fff;border:1px solid var(--ym-line);border-radius:16px;margin-top:12px;box-shadow:0 8px 24px rgba(15,42,67,.05);overflow:hidden}.fin-section>header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;background:#F7F9FC;border-bottom:1px solid var(--ym-line)}.fin-section h2{font:800 12px Montserrat;color:var(--ym-navy);margin:0}.fin-section header p{font-size:8.8px;color:var(--ym-muted);margin:4px 0 0}.fin-body{padding:14px 16px}.fin-table-wrap{overflow:auto}.fin-table{width:100%;border-collapse:collapse;min-width:720px}.fin-table th{font:700 8px Montserrat;text-transform:uppercase;letter-spacing:.05em;color:#667B8D;text-align:left;padding:8px;border-bottom:1px solid #DDE5EC;background:#FAFCFE}.fin-table td{font-size:9px;color:#38536A;padding:8px;border-bottom:1px solid #EDF1F5;vertical-align:top}.fin-table td strong{color:var(--ym-navy)}.money{text-align:right;white-space:nowrap}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font:700 7.8px Montserrat}.b-ok{background:#E7F7EF;color:#176B48}.b-warn{background:#FFF0C9;color:#845B00}.b-bad{background:#FDE9E8;color:#9B2F2B}.b-neutral{background:#EAF0F7;color:#536A7E}.health{display:grid;grid-template-columns:1.15fr .85fr;gap:10px}.health-box{border:1px solid #E0E7EE;border-radius:13px;padding:13px;background:#FBFCFE}.health-box h3{font:800 10px Montserrat;color:var(--ym-navy);margin:0 0 6px}.health-box p{font-size:9px;line-height:1.55;color:#506A7E;margin:4px 0}.warnbox{background:#FFF9EC;border:1px solid #F0DEB7;border-left:4px solid #E7A124;border-radius:12px;padding:11px 12px;margin-top:9px}.warnbox b{font:800 9px Montserrat;color:#75520B}.warnbox p{font-size:9px;color:#6A5934;margin:4px 0 0;line-height:1.5}.mini-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.mini{background:#F7F9FC;border:1px solid #E1E7ED;border-radius:11px;padding:10px}.mini b{display:block;font:800 14px Montserrat;color:var(--ym-navy)}.mini span{font-size:8px;color:var(--ym-muted)}.source-note{font-size:8.5px;color:#60788C;line-height:1.5;background:#F4F7FA;border-radius:10px;padding:9px 11px;margin-top:10px}.empty{padding:18px;text-align:center;color:var(--ym-muted);font-size:10px}@media(max-width:1050px){.fin-grid{grid-template-columns:repeat(2,1fr)}.mini-grid{grid-template-columns:repeat(2,1fr)}.health{grid-template-columns:1fr}}@media(max-width:620px){.fin-grid{grid-template-columns:1fr}.mini-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="ym-main"><header class="ym-topbar"><div style="display:flex;align-items:center;gap:10px"><button id="ymMenu" class="ym-mobile-toggle">☰</button><div class="ym-topbar-title">FINANCEIRO</div></div><div class="ym-topbar-meta"><span class="ym-chip stage">PRODUÇÃO ASSISTIDA</span><span class="ym-chip">ETAPA 3</span></div></header>
<main class="ym-content"><div class="ym-header"><div><div class="ym-eyebrow">YM · ETAPA 3 · FINANCEIRO INTERNO</div><h1 class="ym-title">Performance financeira</h1><p class="ym-lead">A planilha oficial virou arquitetura de cálculo. O CRM é a fonte operacional de clientes, serviços e pagamentos.</p></div><div class="ym-actions"><button id="refresh" class="ym-btn secondary">Atualizar</button></div></div>
<div id="app"><div class="ym-empty">Carregando visão financeira…</div></div>
</main></div><script src="/assets/internal-shell.js"></script><script>
const $=id=>document.getElementById(id),S=v=>YM.esc(v),BRL=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),PCT=v=>(Number(v||0)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',MONTH=v=>{const d=new Date(String(v)+'T12:00:00');return d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})};
let data=null;
async function api(){const s=await YM.requireSession('/FINANCEIRO');if(!s)throw new Error('Sessão necessária');const r=await fetch(YM.SUPABASE_URL+'/functions/v1/finance-dashboard',{headers:{Authorization:'Bearer '+s.access_token,apikey:YM.PUBLISHABLE_KEY}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha no Financeiro');return j}
function badge(t,type='neutral'){return `<span class="badge b-${type}">${S(t)}</span>`}
function money(v){return `<span>${BRL(v)}</span>`}
function render(){const s=data.summary||{},c=data.current_month||{},val=data.valuation_scenario||{},un=data.unmatched_services||[],coverage=Number(c.unit_economics_coverage_pct||0),econ=c.economic_status;const status=econ==='POSITIVO'?badge('ECONÔMICO POSITIVO','ok'):econ==='NEGATIVO'?badge('ECONÔMICO NEGATIVO','bad'):badge('COBERTURA INCOMPLETA','warn');
$('app').innerHTML=`
<div class="fin-grid">
 <div class="fin-card indigo"><div class="k">Previsto · mês</div><div class="v">${BRL(c.previsto)}</div><div class="s">Projeção registrada. Ainda não confundir com venda.</div></div>
 <div class="fin-card orange"><div class="k">Contratado · mês</div><div class="v">${BRL(c.contratado)}</div><div class="s">Compromisso comercial ativo no mês.</div></div>
 <div class="fin-card"><div class="k">Faturado · mês</div><div class="v">${BRL(c.faturado)}</div><div class="s">Cobranças registradas, pagas ou pendentes.</div></div>
 <div class="fin-card primary"><div class="k">Recebido · mês</div><div class="v">${BRL(c.recebido)}</div><div class="s">Dinheiro efetivamente registrado como pago.</div></div>
</div>
<div class="fin-section"><header><div><h2>Saúde financeira do mês</h2><p>Receita real + custos + cobertura de unit economics.</p></div>${status}</header><div class="fin-body"><div class="health"><div class="health-box"><h3>Leitura atual</h3><p><b>Meta:</b> ${BRL(s.monthly_revenue_target)} · <b>Recebido:</b> ${BRL(c.recebido)} · <b>Gap:</b> ${BRL(c.gap_to_target)}</p><p><b>Custo mensal em caixa:</b> ${BRL(s.cash_cost_monthly)} · <b>Custo comercial econômico:</b> ${BRL(s.commercial_economic_cost)} · <b>Base econômica:</b> ${BRL(s.economic_base_monthly)}</p><p><b>Cobertura econômica da receita recebida:</b> ${coverage.toLocaleString('pt-BR',{maximumFractionDigits:1})}%.</p>${coverage>=99.9?`<p><b>Contribuição conhecida:</b> ${BRL(c.known_contribution)} · <b>Resultado econômico:</b> ${BRL(c.economic_result_on_known_economics)}</p>`:`<div class="warnbox"><b>Resultado econômico ainda não deve ser concluído</b><p>Parte da receita recebida pertence a serviços sem custo/horas parametrizados na matriz oficial. O sistema não inventa margem.</p></div>`}</div><div class="health-box"><h3>Capacidade operacional</h3><div class="mini-grid" style="grid-template-columns:repeat(2,1fr)"><div class="mini"><b>${Number(s.productive_hours||0).toLocaleString('pt-BR')}</b><span>horas produtivas/mês</span></div><div class="mini"><b>${Number(s.commercial_hours||0).toLocaleString('pt-BR')}</b><span>horas comerciais</span></div><div class="mini"><b>${Number(s.delivery_hours||0).toLocaleString('pt-BR')}</b><span>horas de entrega</span></div><div class="mini"><b>${Number(s.vendable_hours||0).toLocaleString('pt-BR')}</b><span>horas vendáveis</span></div></div></div></div>${un.length?`<div class="warnbox"><b>Serviços reais ainda sem unit economics</b><p>${un.map(x=>`${S(x.service_name)} (${S(x.service_code||'sem código')})`).join(' · ')}</p></div>`:''}</div></div>
<div class="fin-section"><header><div><h2>Evolução mensal</h2><p>Previsto ≠ Contratado ≠ Faturado ≠ Recebido.</p></div></header><div class="fin-body fin-table-wrap"><table class="fin-table"><thead><tr><th>Mês</th><th class="money">Previsto</th><th class="money">Contratado</th><th class="money">Faturado</th><th class="money">Recebido</th></tr></thead><tbody>${(data.monthly||[]).filter(x=>String(x.month)<='${new Date(new Date().setMonth(new Date().getMonth()+3)).toISOString().slice(0,7)}-01').map(x=>`<tr><td><strong>${MONTH(x.month)}</strong></td><td class="money">${BRL(x.previsto)}</td><td class="money">${BRL(x.contratado)}</td><td class="money">${BRL(x.faturado)}</td><td class="money"><strong>${BRL(x.recebido)}</strong></td></tr>`).join('')}</tbody></table></div></div>
<div class="fin-section"><header><div><h2>Custos mensais</h2><p>Premissas da planilha oficial materializadas no sistema.</p></div><strong>${BRL(s.cash_cost_monthly)}</strong></header><div class="fin-body fin-table-wrap"><table class="fin-table"><thead><tr><th>Item</th><th>Tipo</th><th>Status / fonte</th><th class="money">Mensal</th></tr></thead><tbody>${(data.costs||[]).map(x=>`<tr><td><strong>${S(x.item_name)}</strong></td><td>${badge(x.cost_type)}</td><td>${S(x.status_source||'—')}</td><td class="money">${BRL(x.monthly_value)}</td></tr>`).join('')}</tbody></table></div></div>
<div class="fin-section"><header><div><h2>Unit economics por produto</h2><p>Preço, esforço humano, contribuição, margem e farol.</p></div></header><div class="fin-body fin-table-wrap"><table class="fin-table"><thead><tr><th>Produto</th><th class="money">Preço</th><th class="money">Horas</th><th class="money">Custo entrega</th><th class="money">Contribuição</th><th class="money">Margem</th><th>Farol</th></tr></thead><tbody>${(data.products||[]).map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.reference_price)}</td><td class="money">${Number(x.human_hours||0).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.delivery_cost)}</td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money">${PCT(x.margin)}</td><td>${badge(x.farol,x.farol==='EXCELENTE'?'ok':x.farol==='SAUDAVEL'?'ok':'warn')}</td></tr>`).join('')}</tbody></table></div></div>
<div class="fin-section"><header><div><h2>Capacidade por produto</h2><p>Capacidade teórica × recomendada usando a reserva operacional oficial.</p></div></header><div class="fin-body fin-table-wrap"><table class="fin-table"><thead><tr><th>Produto</th><th class="money">Horas/venda</th><th class="money">Teórica/mês</th><th class="money">Recomendada/mês</th><th class="money">Receita potencial</th><th class="money">Contribuição potencial</th></tr></thead><tbody>${(data.products||[]).map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${Number(x.human_hours||0).toLocaleString('pt-BR')}</td><td class="money">${Number(x.theoretical_capacity_month||0).toLocaleString('pt-BR')}</td><td class="money">${Number(x.recommended_capacity_month||0).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.revenue_recommended)}</td><td class="money">${BRL(x.contribution_recommended)}</td></tr>`).join('')}</tbody></table></div></div>
<div class="fin-section"><header><div><h2>Valuation gerencial · cenário</h2><p>Referência estratégica baseada nas premissas oficiais. Não é laudo formal.</p></div></header><div class="fin-body"><div class="fin-grid"><div class="fin-card"><div class="k">Piso econômico</div><div class="v">${BRL(s.historical_investment)}</div><div class="s">Investimento histórico / ativos intelectuais.</div></div><div class="fin-card"><div class="k">Receita anualizada alvo</div><div class="v">${BRL(val.annualized_revenue)}</div></div><div class="fin-card indigo"><div class="k">Valuation conservador</div><div class="v">${BRL(val.conservative)}</div></div><div class="fin-card green"><div class="k">Valuation superior</div><div class="v">${BRL(val.upper)}</div></div></div><div class="source-note">Fonte canônica: YM_Quadro_Financeiro_ROI_Valuation_COMPLETO. A planilha é referência de arquitetura e premissas; a operação contínua passa a vir do CRM + Financeiro.</div></div></div>`;
}
async function load(){try{data=await api();YM.shell('Financeiro',data.user);render()}catch(e){$('app').innerHTML=`<div class="ym-empty">${S(e.message)}</div>`;YM.toast(e.message,true)}}
$('refresh').onclick=load;load();
</script></body></html>
