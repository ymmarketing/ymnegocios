<main class="ym-content"><div class="ym-header"><div><div class="ym-eyebrow">YM · ETAPA 3 · FINANCEIRO INTERNO</div><h1 class="ym-title">Financeiro da YM</h1><p class="ym-lead">A home mostra a manchete. As análises de produto, capacidade, planejamento e valuation ficam em visões próprias.</p></div><div class="ym-actions"><button id="editTarget" class="ym-btn">Alterar meta financeira</button><button id="refresh" class="ym-btn secondary">Atualizar</button></div></div>

<script src="/assets/internal-shell.js"></script><script>
const $=id=>document.getElementById(id),S=v=>YM.esc(v),N=v=>Number(v||0),BRL=v=>N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),PCT=v=>(N(v)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',PCT100=v=>N(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',MONTH=v=>new Date(String(v)+'T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}),MONTHLONG=v=>new Date(String(v)+'T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
let data=null;
const currentMonth=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`};
const addMonths=(key,n)=>{const d=new Date(String(key)+'T12:00:00');d.setMonth(d.getMonth()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`};
const inputMonth=key=>String(key||'').slice(0,7),fromInput=v=>v?`${v}-01`:currentMonth();
const state={tab:'executiva',preset:'current',from:currentMonth(),to:currentMonth()};
async function api(){const s=await YM.requireSession('/FINANCEIRO');if(!s)throw new Error('Sessão necessária');const headers={Authorization:'Bearer '+s.access_token,apikey:YM.PUBLISHABLE_KEY};const [r,dr,tr]=await Promise.all([fetch(YM.SUPABASE_URL+'/functions/v1/finance-dashboard',{headers}),fetch(YM.SUPABASE_URL+'/functions/v1/motor-dashboard?period=ALL',{headers}),fetch(YM.SUPABASE_URL+'/functions/v1/finance-targets',{headers})]);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha no Financeiro');const dj=await dr.json().catch(()=>({})),tj=await tr.json().catch(()=>({}));j.commercial_snapshot=dr.ok?(dj.commercial?.funnel||null):null;j.target_history=tr.ok?(tj.target_history||[]):[];return j}
async function financeSetting(payload){const sess=await YM.requireSession('/FINANCEIRO');if(!sess)throw new Error('Sessão necessária');const r=await fetch(YM.SUPABASE_URL+'/functions/v1/finance-settings',{method:'POST',headers:{Authorization:'Bearer '+sess.access_token,apikey:YM.PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha ao salvar');return j}
async function financeTarget(payload){const sess=await YM.requireSession('/FINANCEIRO');if(!sess)throw new Error('Sessão necessária');const r=await fetch(YM.SUPABASE_URL+'/functions/v1/finance-targets',{method:'POST',headers:{Authorization:'Bearer '+sess.access_token,apikey:YM.PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha ao alterar a meta');return j}

function openTargetModal(){document.getElementById('targetModal')?.remove();const current=currentMonth(),value=targetForMonth(current),history=[...(data?.target_history||[])].sort((a,b)=>String(b.effective_month).localeCompare(String(a.effective_month)));const wrap=document.createElement('div');wrap.id='targetModal';wrap.className='target-back';wrap.innerHTML=`<section class="target-modal"><header><h2>Alterar meta financeira</h2><button type="button" data-close>×</button></header><div class="target-body"><div class="source-note" style="margin:0 0 12px">A nova meta passa a valer a partir do mês escolhido. Meses anteriores preservam a meta histórica e todas as visões recalculam pela vigência correta.</div><div class="target-grid"><label>Mês de vigência<input id="targetMonth" type="month" value="${inputMonth(current)}"></label><label>Meta mensal (R$)<input id="targetValue" type="number" min="0" step="100" value="${N(value)}"></label><label class="target-wide">Motivo da alteração<textarea id="targetNote" placeholder="Ex.: nova meta definida no planejamento de setembro."></textarea></label><div class="target-wide"><button id="targetSave" class="ym-btn" style="width:100%">Salvar nova meta</button></div></div><div class="target-history"><strong style="font:800 10px Montserrat;color:var(--n)">Histórico de vigência</strong>${history.length?history.map(x=>`<div class="target-history-row"><b>${MONTH(x.effective_month)}</b><b>${BRL(x.monthly_revenue_target)}</b><span>${S(x.note||'Sem observação')}</span></div>`).join(''):'<div class="source-note">Nenhuma alteração histórica registrada.</div>'}</div></div></section>`;document.body.append(wrap);wrap.querySelector('[data-close]').onclick=()=>wrap.remove();wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};wrap.querySelector('#targetSave').onclick=async()=>{const b=wrap.querySelector('#targetSave'),month=wrap.querySelector('#targetMonth').value,target=N(wrap.querySelector('#targetValue').value),note=wrap.querySelector('#targetNote').value.trim();if(!month)return YM.toast('Informe o mês de vigência.',true);if(target<0)return YM.toast('A meta não pode ser negativa.',true);b.disabled=true;b.textContent='Salvando…';try{const j=await financeTarget({effective_month:month,monthly_revenue_target:target,note});data.target_history=j.target_history||data.target_history||[];wrap.remove();YM.toast('Meta financeira atualizada e conexões recalculadas.');await load()}catch(e){YM.toast(e.message,true);b.disabled=false;b.textContent='Salvar nova meta'}}}

const badge=(t,type='neutral')=>`<span class="badge ${type}">${S(t)}</span>`;
const table=(heads,rows,min='780px')=>`<div class="table-wrap"><table class="table" style="min-width:${min}"><thead><tr>${heads.map(h=>`<th class="${h.money?'money':''}">${S(h.label)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
function monthKeys(from,to){let out=[],k=from,guard=0;while(k<=to&&guard<120){out.push(k);k=addMonths(k,1);guard++}return out}
function targetForMonth(k){const h=[...(data?.target_history||[])].sort((a,b)=>String(a.effective_month).localeCompare(String(b.effective_month)));let v=N(data?.summary?.monthly_revenue_target);for(const x of h){if(String(x.effective_month)<=k)v=N(x.monthly_revenue_target);else break}return v}
function periodLabel(){return state.from===state.to?MONTHLONG(state.from):`${MONTH(state.from)} → ${MONTH(state.to)}`}
function applyPreset(p){state.preset=p;const c=currentMonth();if(p==='current'){state.from=c;state.to=c}if(p==='3m'){state.from=addMonths(c,-2);state.to=c}if(p==='6m'){state.from=addMonths(c,-5);state.to=c}if(p==='12m'){state.from=addMonths(c,-11);state.to=c}if(p==='year'){state.from=`${c.slice(0,4)}-01-01`;state.to=c}if(p==='next3'){state.from=c;state.to=addMonths(c,2)}render()}
function filterBox(){return `<div class="filter-box"><div class="filter-head"><strong>Período da leitura</strong><span>A manchete e o planejamento respondem ao intervalo selecionado.</span></div><div class="preset-row"><button class="preset ${state.preset==='current'?'active':''}" data-preset="current">Mês atual</button><button class="preset ${state.preset==='3m'?'active':''}" data-preset="3m">3 meses</button><button class="preset ${state.preset==='6m'?'active':''}" data-preset="6m">6 meses</button><button class="preset ${state.preset==='12m'?'active':''}" data-preset="12m">12 meses</button><button class="preset ${state.preset==='year'?'active':''}" data-preset="year">Ano atual</button><button class="preset ${state.preset==='next3'?'active':''}" data-preset="next3">Próx. 3 meses</button><button class="preset ${state.preset==='custom'?'active':''}" data-preset="custom">Personalizado</button></div><div class="custom-range ${state.preset==='custom'?'show':''}"><label>De<input id="fromMonth" type="month" value="${inputMonth(state.from)}"></label><label>Até<input id="toMonth" type="month" value="${inputMonth(state.to)}"></label></div><span class="period-pill">${S(periodLabel())}</span></div>`}
function aggregates(){const actuals=data.monthly_actuals||[],projection=data.planning?.live_projection||[],keys=monthKeys(state.from,state.to),aset=new Map(actuals.map(x=>[String(x.month),x])),pset=new Map(projection.map(x=>[String(x.month),x]));let recebido=0,contratado=0,faturado=0,previsto=0,planejado=0,meta=0;for(const k of keys){const a=aset.get(k)||{},p=pset.get(k)||{};recebido+=N(a.recebido);contratado+=N(a.contratado);faturado+=N(a.faturado);previsto+=N(a.previsto);planejado+=N(p.planned_revenue);meta+=targetForMonth(k)}const pct=meta>0?recebido/meta*100:0,gap=Math.max(meta-recebido,0),prevFrom=addMonths(state.from,-keys.length),prevTo=addMonths(state.to,-keys.length);let recebidoAnterior=0;for(const a of actuals){const k=String(a.month);if(k>=prevFrom&&k<=prevTo)recebidoAnterior+=N(a.recebido)}return{keys,aset,pset,recebido,contratado,faturado,previsto,planejado,meta,pct,gap,recebidoAnterior,delta:recebido-recebidoAnterior}}
function tabs(){const items=[['executiva','Visão Executiva'],['produtos','Produtos'],['capacidade','Capacidade'],['planejamento','Planejamento'],['valuation','Valuation'],['custos','Custos & Premissas'],['oficial','Base Importada']];return `<div class="fin-tabs">${items.map(([id,l])=>`<button class="fin-tab ${state.tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</div>`}
function executive(){const a=aggregates(),max=Math.max(...a.keys.map(k=>Math.max(N(a.aset.get(k)?.recebido),N(a.aset.get(k)?.contratado),N(a.pset.get(k)?.planned_revenue),targetForMonth(k))),1);const trend=a.keys.map(k=>{const x=a.aset.get(k)||{},p=a.pset.get(k)||{},meta=targetForMonth(k);return `<div class="trend-month"><div class="m">${MONTH(k)}</div><div class="bars"><div class="bar-line"><label>Recebido</label><div class="bar"><span class="rec" style="width:${Math.min(100,N(x.recebido)/max*100)}%"></span></div></div><div class="bar-line"><label>Contratado</label><div class="bar"><span class="con" style="width:${Math.min(100,N(x.contratado)/max*100)}%"></span></div></div><div class="bar-line"><label>Meta</label><div class="bar"><span class="meta" style="width:${Math.min(100,meta/max*100)}%"></span></div></div></div><div class="trend-values"><span>R <b>${BRL(x.recebido)}</b></span><span>C <b>${BRL(x.contratado)}</b></span><span>M <b>${BRL(meta)}</b></span></div></div>`}).join('');const deltaText=a.recebidoAnterior===0?(a.recebido>0?'Há receita no período; a base anterior equivalente foi zero.':'Ainda não há receita registrada nesse intervalo.'):a.delta===0?'O recebido ficou estável contra o período anterior equivalente.':`${a.delta>0?'Acima':'Abaixo'} do período anterior em ${BRL(Math.abs(a.delta))}.`;return `${filterBox()}<section class="hero"><div class="hero-eyebrow">MANCHETE · ${S(periodLabel())}</div><h2>A YM recebeu no período</h2><div class="hero-value">${BRL(a.recebido)}</div><div class="hero-label">de uma meta acumulada de ${BRL(a.meta)}</div><div class="hero-progress"><span style="width:${Math.min(100,Math.max(0,a.pct))}%"></span></div><div class="hero-progress-label">${PCT100(a.pct)} da meta do período</div><div class="hero-metrics"><div class="hero-metric"><span>Já contratado</span><b>${BRL(a.contratado)}</b></div><div class="hero-metric"><span>Faturado</span><b>${BRL(a.faturado)}</b></div><div class="hero-metric"><span>Falta para a meta</span><b>${BRL(a.gap)}</b></div></div><div class="hero-note">${S(deltaText)}${a.planejado>0?` Plano vivo acumulado: ${BRL(a.planejado)}.`:''}</div></section><div class="section"><header><div><h2>Leitura rápida do período</h2><p>Três respostas para entender a situação sem abrir os detalhes técnicos.</p></div></header><div class="section-body"><div class="period-summary"><div class="summary-card emphasis"><strong>${a.pct>=100?'Meta atingida ou superada':`${PCT100(a.pct)} da meta já entrou`}</strong><span>Recebido: ${BRL(a.recebido)} · Gap: ${BRL(a.gap)}.</span></div><div class="summary-card"><strong>${BRL(a.contratado)}</strong><span>Valor comercialmente contratado dentro do período selecionado.</span></div></div></div></div><div class="section"><header><div><h2>Evolução do período</h2><p>Recebido, contratado e meta mensal lado a lado.</p></div></header><div class="section-body"><div class="trend-list">${trend||'<div class="source-note">Sem meses no intervalo.</div>'}</div></div></div>`}

function capacityPanel(){const s=data.summary||{},p=data.products||[],commitments=data.capacity_commitments||[],cur=data.current_month||{},f=data.commercial_snapshot||{};const safe=N(s.safe_delivery_hours||s.vendable_hours),committed=N(s.committed_hours),available=N(s.available_new_sales_hours),occupancy=N(s.capacity_occupancy_pct),freePct=Math.max(0,100-occupancy),target=N(s.monthly_revenue_target),contracted=N(cur.contratado),salesGap=Math.max(0,target-contracted),commercial=N(s.commercial_hours);const band=occupancy<40?'MUITO LIVRE':occupancy<65?'LIVRE':occupancy<80?'SAUDÁVEL':occupancy<90?'ALTA':'SATURADA';const bandNote=occupancy<40?'Seu gargalo hoje não é capacidade de entrega. Há espaço relevante para novos clientes.':occupancy<65?'Ainda há espaço confortável para crescer sem pressionar a operação.':occupancy<80?'A agenda está em faixa saudável; novas vendas precisam considerar o mix de produtos.':occupancy<90?'A capacidade está alta. Novas vendas precisam ser escolhidas pelo esforço de entrega.':'A operação está próxima do limite seguro.';const foundations=p.filter(x=>['FUNDACAO_ESSENCIAL','FUNDACAO_3_MESES','FUNDACAO_6_MESES'].includes(String(x.service_code))),slots=Math.max(0,10-commitments.length);const foundationCards=foundations.map(x=>{const q=Math.min(N(x.available_new_sales_capacity),slots),mh=N(x.monthly_hours_per_active||x.human_hours),mr=N(x.monthly_revenue_per_active||x.reference_price);return `<div class="insight"><div class="tag">SE TODO O SALDO FOSSE ESTE PRODUTO</div><strong>${q} ${S(x.service_name)}</strong><span>${mh.toLocaleString('pt-BR',{maximumFractionDigits:1})}h/mês por cliente ativo · ${BRL(q*mr)}/mês de receita equivalente. É capacidade comparativa, não meta.</span></div>`}).join('');const essential=foundations.find(x=>String(x.service_code)==='FUNDACAO_ESSENCIAL'),essentialPrice=N(essential?.monthly_revenue_per_active||essential?.reference_price),essentialHours=N(essential?.monthly_hours_per_active||essential?.human_hours),essentia function planningPanel(){const a=aggregates(),ms=data.planning?.milestones||[];const cards=ms.map(x=>{const tone=x.milestone_code==='TARGET_15K'?'indigo':x.milestone_code==='MATURITY_20K'?'green':'';return `<div class="metric ${tone}"><div class="k">${S(x.label)}</div><div class="v">${BRL(x.target_revenue)}</div><div class="d">Cenário: ${BRL(x.estimated_revenue)} · ${PCT100(x.capacity_occupancy_pct)} ocupada · resultado econômico ${BRL(x.economic_result_month)}/mês.</div></div>`}).join('');const target=ms.find(x=>x.milestone_code==='TARGET_15K')||{},maturity=ms.find(x=>x.milestone_code==='MATURITY_20K')||{};const rows=a.keys.map(k=>{const x=a.aset.get(k)||{},p=a.pset.get(k)||{};return `<tr><td><strong>${MONTH(k)}</strong></td><td class="money">${BRL(p.planned_revenue)}</td><td class="money">${BRL(x.contratado)}</td><td class="money">${BRL(x.faturado)}</td><td class="money"><strong>${BRL(x.recebido)}</strong></td><td class="money">${BRL(Math.max(targetForMonth(k)-N(x.recebido),0))}</td><td>${S(p.status||'—')}</td></tr>`});const mixCards=ms.map(x=>`<div class="scenario"><h3>${S(x.label)} · ${BRL(x.estimated_revenue)}</h3><p>${x.mix.map(i=>`${N(i.units)}× ${S(i.service_name)}`).join(' · ')}</p><div class="minirow"><span>Horas de clientes</span><b>${N(x.estimated_hours).toLocaleString('pt-BR')}h</b></div><div class="minirow"><span>Ocupação segura</span><b>${PCT100(x.capacity_occupancy_pct)}</b></div><div class="minirow"><span>Resultado econômico/mês</span><b>${BRL(x.economic_result_month)}</b></div></div>`).join('');return `${filterBox()}<div class="section-title">Planejamento</div><p class="section-lead">A notícia agora é simples: R$ 10 mil é piso, R$ 15 mil é a meta operacional e R$ 20 mil é a maturidade da estrutura atual.</p><div class="metric-grid">${cards}</div><div class="section"><header><div><h2>Leitura executiva</h2><p>Quanto a estrutura consegue monetizar sem virar gargalo de entrega.</p></div>${badge('META R$ 15 MIL','ok')}</header><div class="section-body"><div class="period-summary"><div class="summary-card emphasis"><strong>${BRL(target.estimated_revenue)} com ${PCT100(target.capacity_occupancy_pct)} de ocupação</strong><span>A meta operacional ainda deixa cerca de ${(N(data.summary?.safe_delivery_hours)-N(target.estimated_hours)).toLocaleString('pt-BR')}h seguras livres no mês.</span></div><div class="summary-card"><strong>${BRL(maturity.estimated_revenue)} com ${PCT100(maturity.capacity_occupancy_pct)} de ocupação</strong><span>O patamar de maturidade continua dentro da faixa saudável da capacidade atual.</span></div></div></div></div><div class="section"><header><div><h2>Mix de referência</h2><p>Não é obrigação de venda; é uma simulação concreta para provar que os patamares cabem em horas e economia.</p></div></header><div class="section-body"><div class="scenario-grid">${mixCards}</div></div></div><div class="section"><header><div><h2>Mês a mês</h2><p>Previsto ≠ contratado ≠ faturado ≠ recebido.</p></div></header><div class="section-body">${table([{label:'Mês'},{label:'Plano vivo',money:true},{label:'Contratado',money:true},{label:'Faturado',money:true},{label:'Recebido',money:true},{label:'Gap meta',money:true},{label:'Capacidade'}],rows)}</div></div>`}
function valuationPanel(){const ms=data.planning?.milestones||[],run=data.planning?.current_recurring_run_rate||{},target=ms.find(x=>x.milestone_code==='TARGET_15K')||{},maturity=ms.find(x=>x.milestone_code==='MATURITY_20K')||{},v=data.baseline?.valuation||[],floor=(v.find(x=>x.metric_key==='INTELLECTUAL_ASSET_FLOOR')||{}).numeric_value;const currentSupported=N(run.economic_result_month)>0;return `<div class="section-title">Valuation</div><p class="section-lead">O valuation agora acompanha a capacidade real de gerar resultado. A margem fixa de 50% saiu do cálculo principal.</p><div class="metric-grid"><div class="metric ${currentSupported?'green':'orange'}"><div class="k">Run-rate recorrente atual</div><div class="v">${currentSupported?BRL(run.valuation_low)+'–'+BRL(run.valuation_high):'Ainda não sustentado'}</div><div class="d">Receita recorrente ${BRL(run.revenue)} · resultado econômico ${BRL(run.economic_result_month)}/mês.</div></div><div class="metric indigo"><div class="k">Na meta operacional · ~R$ 15k</div><div class="v">${BRL(target.valuation_low)}–${BRL(target.valuation_high)}</div><div class="d">Resultado econômico anual estimado: ${BRL(target.economic_result_year)}.</div></div><div class="metric dark"><div class="k">Na maturidade · R$ 20k</div><div class="v">${BRL(maturity.valuation_low)}–${BRL(maturity.valuation_high)}</div><div class="d">Resultado econômico anual estimado: ${BRL(maturity.economic_result_year)}.</div></div><div class="metric"><div class="k">Ativo intelectual / reposição</div><div class="v">${BRL(floor)}</div><div class="d">Referência de investimento intelectual; não é piso de valuation de mercado.</div></div></div><div class="section"><header><div><h2>A notícia do valuation</h2><p>O valor de R$ 120–180 mil deixa de ser associado a R$ 10 mil de receita.</p></div>${badge('FÓRMULA REVISADA','ok')}</header><div class="section-body"><div class="period-summary"><div class="summary-card emphasis"><strong>R$ 10 mil é piso econômico, não tese de valuation.</strong><span>Com a estrutura atual, o cenário de ~R$ 15 mil já produz resultado econômico positivo, mas ainda sustenta uma faixa menor de valuation.</span></div><div class="summary-card"><strong>R$ 20 mil aproxima a YM da faixa antes projetada.</strong><span>No mix de maturidade, o cálculo por earnings indica aproximadamente ${BRL(maturity.valuation_low)} a ${BRL(maturity.valuation_high)}.</span></div></div></div></div><div class="section"><header><div><h2>Como estamos calculando</h2><p>Receita → contribuição real do mix → custos fixos → 40h comercial → 20h gestão → resultado econômico anual → múltiplos 2x–3x.</p></div></header><div class="section-body">${table([{label:'Marco'},{label:'Receita cenário',money:true},{label:'Ocupação',money:true},{label:'Resultado econômico/mês',money:true},{label:'Resultado anual',money:true},{label:'Valuation 2x',money:true},{label:'Valuation 3x',money:true}],ms.map(x=>`<tr><td><strong>${S(x.label)}</strong></td><td class="money">${BRL(x.estimated_revenue)}</td><td class="money">${PCT100(x.capacity_occupancy_pct)}</td><td class="money">${BRL(x.economic_result_month)}</td><td class="money">${BRL(x.economic_result_year)}</td><td class="money">${BRL(x.valuation_low)}</td><td class="money">${BRL(x.valuation_high)}</td></tr>`))}<div class="source-note">Valuation gerencial para decisão interna. Não é laudo formal nem preço garantido de venda da empresa.</div></div></div>`}
function costsPanel(){const sum=data.summary||{},costs=data.costs_all||[],ass=(data.assumptions_all||[]).filter(x=>x.editable===true&&x.active===true),estimated=(data.products||[]).filter(x=>(x.estimation_status||'HOMOLOGADO')!=='HOMOLOGADO'),types=['FIXO','COMERCIAL','IMPOSTO','VARIAVEL','OUTRO'];const costRows=costs.map(x=>`<tr><td><strong>${S(x.item_name)}</strong><div style="font-size:8px;color:#789">${S(x.item_code)}</div></td><td><select id="ct_${S(x.item_code)}" style="width:100%;padding:7px;border:1px solid #D5E0E8;border-radius:8px">${types.map(t=>`<option ${x.cost_type===t?'selected':''}>${t}</option>`).join('')}</select></td><td><input id="cv_${S(x.item_code)}" type="number" step="0.01" min="0" value="${N(x.monthly_value)}" style="width:105px;padding:7px;border:1px solid #D5E0E8;border-radius:8px"></td><td style="text-align:center"><input id="ca_${S(x.item_code)}" type="checkbox" ${x.active?'checked':''}></td><td><button class="ym-btn secondary" onclick="saveCost('${S(x.item_code)}','${S(x.item_name).replace(/'/g,"&#39;")}')">Salvar</button></td></tr>`);const assRows=ass.map(x=>`<tr><td><strong>${S(x.label)}</strong><div style="font-size:8px;color:#789">${S(x.assumption_key)}</div></td><td>${S(x.unit||'—')}</td><td><input id="av_${S(x.assumption_key)}" type="number" step="0.01" value="${N(x.numeric_value)}" style="width:120px;padding:7px;border:1px solid #D5E0E8;border-radius:8px"></td><td><button class="ym-btn secondary" onclick="saveAssumption('${S(x.assumption_key)}')">Salvar</button></td></tr>`);const prodRows=estimated.map(x=>`<tr><td><strong>${S(x.service_name)}</strong><div style="font-size:8px;color:#789">${S(x.service_code)}</div></td><td><input id="ph_${S(x.service_code)}" type="number" step="0.5" min="0" value="${N(x.human_hours)}" style="width:90px;padding:7px;border:1px solid #D5E0E8;border-radius:8px"></td><td><strong>${BRL(x.reference_price)}</strong></td><td>${PCT(x.margin)}</td><td><button class="ym-btn secondary" onclick="saveProduct('${S(x.service_code)}')">Salvar</button></td></tr>`);return `<div class="section-title">Custos & Premissas</div><p class="section-lead">Esta é a área operacional do modelo. Alterou custo, hora, meta ou parâmetro estimado? Ao salvar, todas as leituras vivas recalculam.</p><div class="metric-grid"><div class="metric dark"><div class="k">Custos em dinheiro / mês</div><div class="v">${BRL(sum.cash_cost_monthly)}</div><div class="d">Itens ativos na competência atual.</div></div><div class="metric"><div class="k">Custo econômico comercial</div><div class="v">${BRL(sum.commercial_economic_cost)}</div><div class="d">Valor das horas reservadas para vender.</div></div><div class="metric"><div class="k">Custo econômico de gestão</div><div class="v">${BRL(sum.management_economic_cost)}</div><div class="d">Tempo de gestão/financeiro/CRM.</div></div><div class="metric indigo"><div class="k">Base econômica mensal</div><div class="v">${BRL(sum.economic_base_monthly)}</div><div class="d">Caixa + tempo comercial + gestão.</div></div></div><div class="section"><header><div><h2>Adicionar custo</h2><p>Ex.: nova ferramenta, assinatura, imposto, mídia ou despesa operacional.</p></div></header><div class="section-body"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end"><label style="font-size:9px">Nome<input id="newCostName" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid #D5E0E8;border-radius:9px"></label><label style="font-size:9px">Valor/mês<input id="newCostValue" type="number" min="0" step="0.01" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid #D5E0E8;border-radius:9px"></label><label style="font-size:9px">Tipo<select id="newCostType" style="display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #D5E0E8;border-radius:9px">${types.map(t=>`<option>${t}</option>`).join('')}</select></label><label style="font-size:9px">Observação<input id="newCostNotes" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid #D5E0E8;border-radius:9px"></label><button class="ym-btn" onclick="addCost()">Adicionar</button></div></div></div><div class="section"><header><div><h2>Custos atuais</h2><p>Desative um item se ele deixar de existir; não apague a memória.</p></div>${badge('EDITÁVEL','ok')}</header><div class="section-body">${table([{label:'Custo'},{label:'Tipo'},{label:'Valor mensal'},{label:'Ativo'},{label:'Ação'}],costRows)}</div></div><div class="section"><header><div><h2>Premissas que dirigem os cálculos</h2><p>Horas, custo-hora, reserva, metas e múltiplos. Alterações afetam o modelo imediatamente.</p></div>${badge('EDITÁVEL','ok')}</header><div class="section-body">${table([{label:'Premissa'},{label:'Unidade'},{label:'Valor'},{label:'Ação'}],assRows)}</div></div>${estimated.length?`<div class="section"><header><div><h2>Produtos ainda em medição</h2><p>Os pacotes de Social Media entram no modelo, mas as horas estão sinalizadas como estimativa até medirmos execução real.</p></div>${badge('ESTIMADO','warn')}</header><div class="section-body">${table([{label:'Produto'},{label:'Horas/mês'},{label:'Preço oficial'},{label:'Margem atual'},{label:'Ação'}],prodRows)}</div></div>`:''}`}
async function saveCost(code,name){try{await financeSetting({action:'UPSERT_COST',item_code:code,item_name:name,monthly_value:N($('cv_'+code).value),cost_type:$('ct_'+code).value,active:$('ca_'+code).checked,reason:'Atualização manual em Custos & Premissas'});YM.toast('Custo atualizado');await load()}catch(e){YM.toast(e.message,true)}}
async function addCost(){try{const name=$('newCostName').value.trim(),value=N($('newCostValue').value);if(!name)throw new Error('Informe o nome do custo');await financeSetting({action:'UPSERT_COST',item_name:name,monthly_value:value,cost_type:$('newCostType').value,notes:$('newCostNotes').value,active:true,reason:'Novo custo incluído no Financeiro'});YM.toast('Custo incluído');await load()}catch(e){YM.toast(e.message,true)}}
async function saveAssumption(key){try{await financeSetting({action:'UPDATE_ASSUMPTION',assumption_key:key,numeric_value:N($('av_'+key).value),reason:'Premissa atualizada no Financeiro'});YM.toast('Premissa atualizada');await load()}catch(e){YM.toast(e.message,true)}}
async function saveProduct(code){try{await financeSetting({action:'UPDATE_PRODUCT',service_code:code,human_hours:N($('ph_'+code).value),estimation_status:'ESTIMADO',reason:'Parâmetro estimado atualizado no Financeiro'});YM.toast('Produto atualizado');await load()}catch(e){YM.toast(e.message,true)}}
function officialPanel(){const o=data.baseline||{},ass=data.assumptions_all||[],costs=data.costs_all||[],p=data.products||[],sc=o.scenarios||[],proj=o.projection_monthly||[],roi=o.roi_monthly||[],val=o.valuation||[],kpi=o.dashboard_kpis||[],pay=o.dashboard_payback||[];return `<div class="source-box"><strong>BASE IMPORTADA · YM_Quadro_Financeiro_ROI_Valuation_COMPLETO.xlsx</strong><p>Snapshot para memória e auditoria. Estes números importados NÃO alimentam mais as decisões das outras abas. O modelo vivo usa CRM + custos + premissas + produtos atuais.</p></div><details class="sheet"><summary>Dashboard importado</summary><div class="sheet-body">${table([{label:'Indicador'},{label:'Valor',money:true},{label:'Unidade'}],kpi.map(x=>`<tr><td><strong>${S(x.label)}</strong></td><td class="money">${N(x.numeric_value).toLocaleString('pt-BR')}</td><td>${S(x.unit||'—')}</td></tr>`),'520px')}${table([{label:'Produto'},{label:'Contribuição/venda',money:true},{label:'Vendas p/ investimento',money:true}],pay.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money">${N(x.sales_to_recover_23000).toLocaleString('pt-BR')}</td></tr>`),'520px')}</div></details><details class="sheet"><summary>Premissas atuais</summary><div class="sheet-body">${table([{label:'Premissa'},{label:'Categoria'},{label:'Valor'},{label:'Unidade'},{label:'Fonte'}],ass.map(x=>`<tr><td><strong>${S(x.label)}</strong></td><td>${S(x.category)}</td><td>${N(x.numeric_value).toLocaleString('pt-BR')}</td><td>${S(x.unit||'—')}</td><td>${S(x.source_note||'—')}</td></tr>`))}</div></details><details class="sheet"><summary>Custos atuais</summary><div class="sheet-body">${table([{label:'Item'},{label:'Tipo'},{label:'Mensal',money:true},{label:'Ativo'}],costs.map(x=>`<tr><td><strong>${S(x.item_name)}</strong></td><td>${S(x.cost_type)}</td><td class="money">${BRL(x.monthly_value)}</td><td>${x.active?'Sim':'Não'}</td></tr>`),'620px')}</div></details><details class="sheet"><summary>Produtos vivos</summary><div class="sheet-body">${table([{label:'Produto'},{label:'Preço',money:true},{label:'Horas',money:true},{label:'Contribuição',money:true},{label:'Margem',money:true},{label:'Parâmetro'}],p.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.reference_price)}</td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money">${PCT(x.margin)}</td><td>${S(x.estimation_status||'HOMOLOGADO')}</td></tr>`))}</div></details><details class="sheet"><summary>Visão Geral importada</summary><div class="sheet-body">${table([{label:'Cenário'},{label:'Mix'},{label:'Receita',money:true},{label:'Resultado econômico',money:true},{label:'Capacidade'}],sc.map(x=>`<tr><td><strong>${S(x.scenario_name)}</strong></td><td>${S(x.mix_monthly)}</td><td class="money">${BRL(x.revenue)}</td><td class="money">${BRL(x.economic_result)}</td><td>${S(x.capacity_status)}</td></tr>`))}</div></details><details class="sheet"><summary>Projeção Mensal importada</summary><div class="sheet-body">${table([{label:'Mês'},{label:'Receita planejada',money:true},{label:'Resultado econômico',money:true},{label:'Capacidade'}],proj.map(x=>`<tr><td><strong>${MONTH(x.month)}</strong></td><td class="money">${BRL(x.planned_revenue)}</td><td class="money">${BRL(x.economic_result)}</td><td>${S(x.status)}</td></tr>`))}</div></details><details class="sheet"><summary>ROI importado</summary><div class="sheet-body">${table([{label:'Mês'},{label:'Receita',money:true},{label:'Resultado econômico',money:true},{label:'ROI acumulado',money:true}],roi.map(x=>`<tr><td><strong>${MONTH(x.month)}</strong></td><td class="money">${BRL(x.revenue)}</td><td class="money">${BRL(x.economic_result)}</td><td class="money">${PCT(x.accumulated_roi)}</td></tr>`))}</div></details><details class="sheet"><summary>Valuation importado</summary><div class="sheet-body">${table([{label:'Indicador'},{label:'Fórmula / premissa'},{label:'Valor',money:true},{label:'Observação'}],val.map(x=>`<tr><td><strong>${S(x.indicator)}</strong></td><td>${S(x.formula_premise)}</td><td class="money">${BRL(x.numeric_value)}</td><td>${S(x.observation||'—')}</td></tr>`))}</div></details>`}
function render(){if(!data)return;$('editTarget').hidden=data.user?.role!=='ADMIN';const panel=state.tab==='executiva'?executive():state.tab==='produtos'?productsPanel():state.tab==='capacidade'?capacityPanel():state.tab==='planejamento'?planningPanel():state.tab==='valuation'?valuationPanel():state.tab==='custos'?costsPanel():officialPanel();$('app').innerHTML=`<div class="fin-status">CÁLCULOS VIVOS · custos e premissas editáveis</div>${tabs()}<section class="fin-panel active">${panel}</section>`;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=b.dataset.preset;if(p==='custom'){state.preset='custom';render()}else applyPreset(p)});const f=$('fromMonth'),t=$('toMonth');if(f)f.onchange=()=>{state.preset='custom';state.from=fromInput(f.value);if(state.from>state.to)state.to=state.from;render()};if(t)t.onchange=()=>{state.preset='custom';state.to=fromInput(t.value);if(state.to<state.from)state.from=state.to;render()}}
async function load(){try{data=await api();render()}catch(e){$('app').innerHTML=`<div class="ym-empty">${S(e.message)}</div>`;YM.toast(e.message,true)}}
$('editTarget').onclick=openTargetModal;$('refresh').onclick=load;load();
</script></body></html>
