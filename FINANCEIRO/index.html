.story-act{scroll-margin-top:112px;margin-top:18px}.act-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:9px}.act-no{flex:0 0 31px;height:31px;border-radius:10px;background:#EAF0F7;color:var(--n);display:grid;place-items:center;font:800 11px Montserrat}.act-title{font:800 17px Montserrat;color:var(--n);margin:0}.act-question{font-size:11px;color:var(--muted);margin:3px 0 0;line-height:1.45}.story-answer{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 8px 24px rgba(15,42,67,.045);margin-bottom:10px}.story-answer.primary{border-left:4px solid var(--i)}.story-answer.warn{border-left:4px solid var(--o);background:#FFFBF2}.answer-label{font:700 9px Montserrat;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.answer-big{font:800 23px Montserrat;color:var(--n);margin-top:5px}.answer-copy{font-size:11px;line-height:1.55;color:#50697D;margin-top:5px}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.metric-card .label{font:700 8.5px Montserrat;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.metric-card .value{font:800 19px Montserrat;color:var(--n);margin-top:5px}.metric-card .desc{font-size:9.5px;color:#60788B;margin-top:4px;line-height:1.45}.metric-card.dark{background:var(--n);border-color:var(--n)}.metric-card.dark .label,.metric-card.dark .desc{color:#BCD0DF}.metric-card.dark .value{color:#fff}.metric-card.indigo{background:#F3F3FF;border-color:#D9DAF5}.metric-card.orange{background:#FFF8EB;border-color:#F0DFBB}.metric-card.green{background:#F0F9F5;border-color:#D6EADF}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.flow-item{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.flow-item:not(:last-child):after{content:"→";position:absolute;right:-8px;top:50%;transform:translateY(-50%);z-index:2;color:#9AAEBE;font-weight:800;background:var(--bg);padding:2px}.flow-item small{display:block;color:var(--muted);font:700 8.5px Montserrat;text-transform:uppercase}.flow-item strong{display:block;color:var(--n);font:800 18px Montserrat;margin-top:5px}.flow-item em{display:block;color:#637B8E;font-style:normal;font-size:9px;margin-top:3px;line-height:1.4}
.insight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.insight{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.insight .tag{font:700 8px Montserrat;color:var(--i);text-transform:uppercase;letter-spacing:.05em}.insight strong{display:block;font:800 14px Montserrat;color:var(--n);margin-top:5px}.insight span{display:block;font-size:9.5px;color:#60788B;margin-top:4px;line-height:1.45}
.month-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.month-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.month-card .month{font:800 10px Montserrat;color:var(--n);text-transform:uppercase}.month-card .row{display:flex;justify-content:space-between;gap:7px;font-size:9px;color:#60788B;padding-top:7px}.month-card .row b{color:var(--n)}.month-card.current{border:2px solid var(--i)}

.tech-layer{margin-top:22px;border:1px solid #D8E1E9;border-radius:17px;background:#fff;overflow:hidden}.tech-layer>summary{cursor:pointer;list-style:none;padding:15px 17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.tech-layer>summary::-webkit-details-marker{display:none}.tech-layer>summary strong{font:800 13px Montserrat;color:var(--n)}.tech-layer>summary span{font-size:10px;color:var(--muted)}.tech-layer[open]>summary{border-bottom:1px solid var(--line);background:#F8FAFC}.tech-body{padding:13px}.sheet{border:1px solid #E0E7ED;border-radius:13px;margin-bottom:9px;overflow:hidden}.sheet>summary{cursor:pointer;list-style:none;padding:12px 13px;font:800 10px Montserrat;color:var(--n);background:#F9FBFD}.sheet>summary::-webkit-details-marker{display:none}.sheet[open]>summary{border-bottom:1px solid #E3E9EE}.sheet-body{padding:10px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{font:700 8px Montserrat;text-transform:uppercase;letter-spacing:.04em;color:#667B8D;text-align:left;padding:8px;background:#FAFCFE;border-bottom:1px solid #DDE5EC;white-space:nowrap}.table td{font-size:9px;color:#38536A;padding:8px;border-bottom:1px solid #EDF1F5;vertical-align:top}.table td strong{color:var(--n)}.money{text-align:right;white-space:nowrap}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font:700 7.5px Montserrat;white-space:nowrap}.ok{background:#E5F6EE;color:#176B48}.warn-b{background:#FFF0C9;color:#845B00}.bad{background:#FDE9E8;color:#9B2F2B}.neutral{background:#EAF0F7;color:#536A7E}.source-note{font-size:9px;color:#60788B;line-height:1.5;background:#F4F7FA;padding:9px 11px;border-radius:10px;margin-top:10px}
@media(max-width:1050px){.hero-metrics,.metric-grid,.insight-grid{grid-template-columns:repeat(2,1fr)}.flow,.month-grid{grid-template-columns:repeat(2,1fr)}.flow-item:after{display:none}}
@media(max-width:620px){.story-hero{padding:18px 16px;border-radius:18px}.story-hero h2{font-size:16px}.story-hero .hero-value{font-size:35px}.hero-metrics,.metric-grid,.insight-grid,.flow,.month-grid{grid-template-columns:1fr}.hero-metric b{font-size:16px}.story-nav{top:57px}.story-act{scroll-margin-top:106px}.act-title{font-size:15px}.answer-big{font-size:21px}.metric-card .value{font-size:18px}.flow-item{display:grid;grid-template-columns:1fr auto;column-gap:8px}.flow-item small,.flow-item em{grid-column:1}.flow-item strong{grid-column:2;grid-row:1/3;align-self:center}.tech-layer>summary{align-items:flex-start;flex-direction:column}.ym-header .ym-lead{font-size:11px}}
</style></head><body>
<div class="ym-main"><header class="ym-topbar"><div style="display:flex;align-items:center;gap:10px"><button id="ymMenu" class="ym-mobile-toggle">☰</button><div class="ym-topbar-title">FINANCEIRO</div></div><div class="ym-topbar-meta"><span class="ym-chip stage">PRODUÇÃO ASSISTIDA</span><span class="ym-chip">ETAPA 3</span></div></header>
<main class="ym-content"><div class="ym-header"><div><div class="ym-eyebrow">YM · ETAPA 3 · FINANCEIRO INTERNO</div><h1 class="ym-title">Leitura financeira da YM</h1><p class="ym-lead">Primeiro a história que os dados contam. Depois, a planilha oficial completa para conferência.</p></div><div class="ym-actions"><button id="refresh" class="ym-btn secondary">Atualizar</button></div></div>
<div id="app"><div class="ym-empty">Carregando leitura financeira…</div></div></main></div>
<script src="/assets/internal-shell.js"></script><script>
const $=id=>document.getElementById(id),S=v=>YM.esc(v),N=v=>Number(v||0),BRL=v=>N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),PCT=v=>(N(v)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',PCT100=v=>N(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',MONTH=v=>new Date(String(v)+'T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}),MONTHLONG=v=>new Date(String(v)+'T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
let data=null;
async function api(){const s=await YM.requireSession('/FINANCEIRO');if(!s)throw new Error('Sessão necessária');const r=await fetch(YM.SUPABASE_URL+'/functions/v1/finance-dashboard',{headers:{Authorization:'Bearer '+s.access_token,apikey:YM.PUBLISHABLE_KEY}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha no Financeiro');return j}
const badge=(t,type='neutral')=>`<span class="badge ${type}">${S(t)}</span>`;
const table=(heads,rows,min='760px')=>`<div class="table-wrap"><table class="table" style="min-width:${min}"><thead><tr>${heads.map(h=>`<th class="${h.money?'money':''}">${S(h.label)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
function render(){const o=data.official||{},s=data.summary||{},c=data.current_month||{},actuals=data.monthly_actuals||[],projection=o.projection_monthly||[],products=data.products||[],valuation=data.valuation_scenario||{};const currentKey=String(c.month||'');const target=N(s.monthly_revenue_target),received=N(c.recebido),contracted=N(c.contratado),billed=N(c.faturado),gap=Math.max(target-received,0),targetPct=target>0?(received/target*100):0;const officialCurrent=projection.find(x=>String(x.month)===currentKey)||null;const prev=[...actuals].filter(x=>String(x.month)<currentKey).sort((a,b)=>String(b.month).localeCompare(String(a.month)))[0]||null;const prevReceived=N(prev?.recebido),delta=received-prevReceived;const nextActual=[...actuals].filter(x=>String(x.month)>currentKey).sort((a,b)=>String(a.month).localeCompare(String(b.month)))[0]||null;
const bySale=[...products].sort((a,b)=>N(b.contribution_per_sale)-N(a.contribution_per_sale))[0];const byHour=[...products].sort((a,b)=>N(b.contribution_per_hour)-N(a.contribution_per_hour))[0];const byScale=[...products].sort((a,b)=>N(b.recommended_capacity_month)-N(a.recommended_capacity_month))[0];const attention=[...products].sort((a,b)=>N(a.margin)-N(b.margin))[0];const coverage=N(c.unit_economics_coverage_pct);const econComplete=coverage>=99.9;const monthsToShow=projection.filter(x=>String(x.month)>=currentKey).slice(0,4);const actualMap=new Map(actuals.map(x=>[String(x.month),x]));const roiRows=o.roi_monthly||[];const roiCurrent=roiRows.find(x=>String(x.month)===currentKey)||[...roiRows].filter(x=>String(x.month)<=currentKey).sort((a,b)=>String(b.month).localeCompare(String(a.month)))[0]||null;
$('app').innerHTML=`
<div class="story-status">ESTRUTURA DE LEITURA EM VALIDAÇÃO · números ainda não homologados</div>
<section id="hoje" class="story-hero">
 <div class="story-eyebrow">HOJE · ${S(MONTHLONG(currentKey))}</div>
 <h2>Como está a YM neste momento?</h2>
 <div class="hero-value">${BRL(received)}</div><div class="hero-label">recebidos no mês</div>
 <div class="hero-progress"><span style="width:${Math.min(100,Math.max(0,targetPct))}%"></span></div><div class="hero-progress-label">${PCT100(targetPct)} da meta mensal de ${BRL(target)}</div>
 <div class="hero-metrics"><div class="hero-metric"><span>Já contratado no mês</span><b>${BRL(contracted)}</b></div><div class="hero-metric"><span>Ainda falta para a meta</span><b>${BRL(gap)}</b></div><div class="hero-metric"><span>Faturado no mês</span><b>${BRL(billed)}</b></div></div>
 <div class="hero-note">${prev?`Em relação a ${S(MONTH(prev.month))}, o recebido está ${delta>=0?'acima':'abaixo'} em ${BRL(Math.abs(delta))}.`:''}${officialCurrent?` O plano oficial deste mês é ${BRL(officialCurrent.planned_revenue)}.`:''}</div>
</section>
<nav class="story-nav"><a href="#hoje">Hoje</a><a href="#dinheiro">Dinheiro</a><a href="#produtos">Produtos</a><a href="#capacidade">Capacidade</a><a href="#futuro">Futuro</a><a href="#patrimonio">Patrimônio</a><a href="#dados">Dados oficiais</a></nav>
<section id="dinheiro" class="story-act"><div class="act-head"><div class="act-no">2</div><div><h2 class="act-title">Dinheiro</h2><p class="act-question">Quanto custa manter a YM funcionando e o que sobra?</p></div></div>
 <div class="flow"><div class="flow-item"><small>Recebido</small><strong>${BRL(received)}</strong><em>dinheiro registrado como pago</em></div><div class="flow-item"><small>Custos em caixa</small><strong>${BRL(s.cash_cost_monthly)}</strong><em>custos mensais da operação</em></div><div class="flow-item"><small>Custo econômico comercial</small><strong>${BRL(s.commercial_economic_cost)}</strong><em>valor econômico do tempo comercial</em></div><div class="flow-item"><small>Resultado econômico</small><strong>${econComplete?BRL(c.economic_result_on_known_economics):'Em aberto'}</strong><em>${econComplete?'cálculo com cobertura completa':'aguarda unit economics completa'}</em></div></div>
 ${econComplete?`<div class="story-answer primary"><div class="answer-label">Leitura</div><div class="answer-big">${N(c.economic_result_on_known_economics)>=0?'A operação apresenta resultado econômico positivo neste recorte.':'O resultado econômico deste recorte está negativo.'}</div><div class="answer-copy">Contribuição conhecida: ${BRL(c.known_contribution)}. Esta leitura considera a estrutura econômica parametrizada no sistema.</div></div>`:`<div class="story-answer warn"><div class="answer-label">Ainda não dá para concluir quanto sobra</div><div class="answer-big">${PCT100(coverage)} da receita recebida tem unit economics reconhecida</div><div class="answer-copy">O sistema não transforma receita sem custo/horas parametrizados em lucro. Primeiro completamos a cobertura; depois validamos o resultado econômico.</div></div>`}
</section>
<section id="produtos" class="story-act"><div class="act-head"><div class="act-no">3</div><div><h2 class="act-title">Produtos</h2><p class="act-question">O que vale mais a pena vender com a estrutura atual?</p></div></div>
 <div class="insight-grid"><div class="insight"><div class="tag">Maior contribuição por venda</div><strong>${S(bySale?.service_name||'—')}</strong><span>${BRL(bySale?.contribution_per_sale)} de contribuição por venda</span></div><div class="insight"><div class="tag">Melhor contribuição por hora</div><strong>${S(byHour?.service_name||'—')}</strong><span>${BRL(byHour?.contribution_per_hour)} por hora humana</span></div><div class="insight"><div class="tag">Maior capacidade de escala</div><strong>${S(byScale?.service_name||'—')}</strong><span>até ${N(byScale?.recommended_capacity_month).toLocaleString('pt-BR')} vendas/mês na capacidade recomendada</span></div></div>
 <div class="story-answer"><div class="answer-label">Ponto de atenção para validar</div><div class="answer-big">${S(attention?.service_name||'—')}</div><div class="answer-copy">É o produto com a menor margem hoje na matriz carregada (${PCT(attention?.margin)}). Isso não significa que esteja errado ou que deva sair do portfólio; é apenas o primeiro ponto que um consultor provavelmente perguntaria.</div></div>
</section>
<section id="capacidade" class="story-act"><div class="act-head"><div class="act-no">4</div><div><h2 class="act-title">Capacidade</h2><p class="act-question">A YM consegue crescer sem comprometer a entrega?</p></div></div>
 <div class="metric-grid"><div class="metric-card"><div class="label">Horas produtivas</div><div class="value">${N(s.productive_hours).toLocaleString('pt-BR')}h</div><div class="desc">base mensal parametrizada</div></div><div class="metric-card orange"><div class="label">Horas comerciais</div><div class="value">${N(s.commercial_hours).toLocaleString('pt-BR')}h</div><div class="desc">tempo reservado para venda/prospecção</div></div><div class="metric-card indigo"><div class="label">Horas vendáveis</div><div class="value">${N(s.vendable_hours).toLocaleString('pt-BR')}h</div><div class="desc">capacidade após reserva operacional</div></div></div>
 <div class="story-answer primary"><div class="answer-label">Pergunta prática</div><div class="answer-big">Quanto consigo vender sem me atropelar?</div><div class="answer-copy">A matriz atual indica, isoladamente, ${S(byScale?.service_name||'—')} como o produto de maior capacidade. A combinação real de produtos deve respeitar as ${N(s.vendable_hours).toLocaleString('pt-BR')} horas vendáveis do mês.</div></div>
</section>
<section id="futuro" class="story-act"><div class="act-head"><div class="act-no">5</div><div><h2 class="act-title">Futuro</h2><p class="act-question">Quanto precisamos vender antes de cada mês começar?</p></div></div>
 <div class="month-grid">${monthsToShow.map((p,idx)=>{const a=actualMap.get(String(p.month))||{};const plan=N(p.planned_revenue),ct=N(a.contratado),rec=N(a.recebido),futureGap=Math.max(plan-ct,0);return `<div class="month-card ${idx===0?'current':''}"><div class="month">${S(MONTH(p.month))}${idx===0?' · atual':''}</div><div class="row"><span>Plano</span><b>${BRL(plan)}</b></div><div class="row"><span>Contratado</span><b>${BRL(ct)}</b></div><div class="row"><span>Recebido</span><b>${BRL(rec)}</b></div><div class="row"><span>Gap comercial</span><b>${BRL(futureGap)}</b></div><div class="story-progress"><span style="width:${plan?Math.min(100,ct/plan*100):0}%"></span></div></div>`}).join('')}</div>
 ${nextActual?`<div class="story-answer"><div class="answer-label">Próximo mês</div><div class="answer-big">${BRL(nextActual.contratado)} já aparecem contratados para ${S(MONTH(nextActual.month))}</div><div class="answer-copy">Essa é a leitura que permite decidir a intensidade comercial antes da virada do mês.</div></div>`:''}
</section>
<section id="patrimonio" class="story-act"><div class="act-head"><div class="act-no">6</div><div><h2 class="act-title">Patrimônio</h2><p class="act-question">O investimento está retornando e quanto o negócio pode valer?</p></div></div>
 <div class="metric-grid"><div class="metric-card"><div class="label">Investimento histórico</div><div class="value">${BRL(s.historical_investment)}</div><div class="desc">piso econômico registrado</div></div><div class="metric-card ${roiCurrent&&N(roiCurrent.investment_balance)<=0?'green':'orange'}"><div class="label">Saldo a recuperar · plano</div><div class="value">${roiCurrent?BRL(roiCurrent.investment_balance):'—'}</div><div class="desc">linha oficial de ROI/Payback</div></div><div class="metric-card dark"><div class="label">Valuation gerencial</div><div class="value">${BRL(valuation.conservative)} – ${BRL(valuation.upper)}</div><div class="desc">cenário de referência; não é laudo formal</div></div></div>
 <div class="story-answer"><div class="answer-label">ROI acumulado do plano</div><div class="answer-big">${roiCurrent?PCT(roiCurrent.accumulated_roi):'—'}</div><div class="answer-copy">Este indicador vem da aba oficial de ROI Mensal. Nesta fase estamos validando a forma de leitura, não homologando a premissa.</div></div>
</section>
${renderTechnical(o,actualMap)}
`}
function renderTechnical(o,actualMap){const assumptions=data.assumptions||[],costs=data.costs||[],products=data.products||[],scenarios=o.scenarios||[],projection=o.projection_monthly||[],roi=o.roi_monthly||[],valuation=o.valuation||[],kpis=o.dashboard_kpis||[],payback=o.dashboard_payback||[];return `<details id="dados" class="tech-layer"><summary><div><strong>Dados oficiais / Planilha completa</strong><br><span>Use esta camada para conferir de onde cada leitura saiu.</span></div>${badge('8 abas preservadas','neutral')}</summary><div class="tech-body">
<details class="sheet"><summary>Premissas</summary><div class="sheet-body">${table([{label:'Premissa'},{label:'Categoria'},{label:'Valor',money:true},{label:'Unidade'},{label:'Fonte'}],assumptions.map(x=>`<tr><td><strong>${S(x.label)}</strong></td><td>${S(x.category)}</td><td class="money">${N(x.numeric_value).toLocaleString('pt-BR')}</td><td>${S(x.unit||'—')}</td><td>${S(x.source_note||'—')}</td></tr>`))}<div class="source-note"><strong>Custos mensais:</strong> ${costs.map(x=>`${S(x.item_name)} (${BRL(x.monthly_value)})`).join(' · ')}</div></div></details>
<details class="sheet"><summary>Produtos</summary><div class="sheet-body">${table([{label:'Produto'},{label:'Preço',money:true},{label:'Horas',money:true},{label:'Custo entrega',money:true},{label:'Contribuição',money:true},{label:'Margem',money:true},{label:'Contrib./hora',money:true}],products.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.reference_price)}</td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.delivery_cost)}</td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money">${PCT(x.margin)}</td><td class="money">${BRL(x.contribution_per_hour)}</td></tr>`),'900px')}</div></details>
<details class="sheet"><summary>ROI Mensal</summary><div class="sheet-body">${table([{label:'Mês'},{label:'Receita',money:true},{label:'Contribuição',money:true},{label:'Resultado econômico',money:true},{label:'Acumulado',money:true},{label:'Saldo investimento',money:true},{label:'ROI acumulado',money:true}],roi.map(x=>`<tr><td><strong>${S(MONTH(x.month))}</strong></td><td class="money">${BRL(x.revenue)}</td><td class="money">${BRL(x.product_contribution)}</td><td class="money">${BRL(x.economic_result)}</td><td class="money">${BRL(x.accumulated_result)}</td><td class="money">${BRL(x.investment_balance)}</td><td class="money">${PCT(x.accumulated_roi)}</td></tr>`),'980px')}</div></details>
<details class="sheet"><summary>Valuation</summary><div class="sheet-body">${table([{label:'Indicador'},{label:'Premissa / fórmula'},{label:'Valor',money:true},{label:'Observação'}],valuation.map(x=>`<tr><td><strong>${S(x.indicator)}</strong></td><td>${S(x.formula_premise)}</td><td class="money">${BRL(x.numeric_value)}</td><td>${S(x.observation||'—')}</td></tr>`),'760px')}</div></details>
<details class="sheet"><summary>Dashboard</summary><div class="sheet-body">${table([{label:'Indicador'},{label:'Valor',money:true},{label:'Unidade'}],kpis.map(x=>`<tr><td><strong>${S(x.label)}</strong></td><td class="money">${x.unit==='R$'?BRL(x.numeric_value):N(x.numeric_value).toLocaleString('pt-BR')}</td><td>${S(x.unit||'—')}</td></tr>`),'620px')}<div style="height:8px"></div>${table([{label:'Produto-chave'},{label:'Contribuição/venda',money:true},{label:'Vendas p/ recuperar investimento',money:true}],payback.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money">${N(x.sales_to_recover_23000).toLocaleString('pt-BR')}</td></tr>`),'620px')}</div></details>
<details class="sheet"><summary>Capacidade</summary><div class="sheet-body">${table([{label:'Produto'},{label:'Horas/venda',money:true},{label:'Teórica/mês',money:true},{label:'Recomendada/mês',money:true},{label:'Receita potencial',money:true},{label:'Contribuição potencial',money:true}],products.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}</td><td class="money">${N(x.theoretical_capacity_month).toLocaleString('pt-BR')}</td><td class="money">${N(x.recommended_capacity_month).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.revenue_recommended)}</td><td class="money">${BRL(x.contribution_recommended)}</td></tr>`),'900px')}</div></details>
<details class="sheet"><summary>Visão Geral</summary><div class="sheet-body">${table([{label:'Cenário'},{label:'Mix mensal'},{label:'Receita',money:true},{label:'Horas',money:true},{label:'Resultado caixa',money:true},{label:'Resultado econômico',money:true},{label:'Capacidade'}],scenarios.map(x=>`<tr><td><strong>${S(x.scenario_name)}</strong></td><td>${S(x.mix_monthly)}</td><td class="money">${BRL(x.revenue)}</td><td class="money">${N(x.delivery_hours).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.cash_result)}</td><td class="money">${BRL(x.economic_result)}</td><td>${S(x.capacity_status)}</td></tr>`),'980px')}</div></details>
<details class="sheet"><summary>Projeção Mensal</summary><div class="sheet-body">${table([{label:'Mês'},{label:'Plano',money:true},{label:'Contratado CRM',money:true},{label:'Faturado CRM',money:true},{label:'Recebido CRM',money:true},{label:'Resultado econômico plano',money:true},{label:'Utilização capacidade',money:true},{label:'Status'}],projection.map(x=>{const a=actualMap.get(String(x.month))||{};return `<tr><td><strong>${S(MONTH(x.month))}</strong></td><td class="money">${BRL(x.planned_revenue)}</td><td class="money">${BRL(a.contratado)}</td><td class="money">${BRL(a.faturado)}</td><td class="money">${BRL(a.recebido)}</td><td class="money">${BRL(x.economic_result)}</td><td class="money">${PCT(x.capacity_utilization)}</td><td>${S(x.status)}</td></tr>`}),'1080px')}</div></details>
</div></details>`}
async function load(){try{data=await api();render()}catch(e){$('app').innerHTML=`<div class="story-answer warn"><div class="answer-label">Financeiro indisponível</div><div class="answer-big">Não foi possível carregar os dados.</div><div class="answer-copy">${S(e.message)}</div></div>`}}
$('refresh').onclick=load;load();
