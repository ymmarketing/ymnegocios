<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Financeiro — YM Marketing & Negócios</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/assets/internal-shell.css">
<style>
:root{--fin-navy:#0A2540;--fin-indigo:#484DCF;--fin-orange:#F59E0B;--fin-green:#138A60;--fin-red:#B83D3D;--fin-line:#DDE6EE;--fin-muted:#657B8F}
.fin-source{background:linear-gradient(135deg,#0A2540,#174C78 68%,#484DCF);border-radius:18px;padding:18px 20px;color:#fff;margin-bottom:12px;box-shadow:0 12px 32px rgba(10,37,64,.13)}.fin-source b{font:800 12px Montserrat}.fin-source p{font-size:10px;line-height:1.55;color:#D5E4EF;margin:5px 0 0}.fin-tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 10px;position:sticky;top:62px;background:#F7F9FC;z-index:5}.fin-tab{border:1px solid #D6E0EA;background:#fff;color:#516B80;border-radius:999px;padding:8px 11px;font:700 8.5px Montserrat;white-space:nowrap;cursor:pointer}.fin-tab.active{background:var(--fin-navy);border-color:var(--fin-navy);color:#fff}.fin-panel{display:none}.fin-panel.active{display:block}.fin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fin-card{background:#fff;border:1px solid var(--fin-line);border-radius:15px;padding:14px;box-shadow:0 8px 22px rgba(15,42,67,.05)}.fin-card .k{font:700 8px Montserrat;color:var(--fin-muted);text-transform:uppercase;letter-spacing:.08em}.fin-card .v{font:800 22px Montserrat;color:var(--fin-navy);margin-top:6px}.fin-card .s{font-size:8.5px;color:var(--fin-muted);margin-top:5px;line-height:1.45}.fin-card.dark{background:var(--fin-navy);border-color:var(--fin-navy)}.fin-card.dark .k,.fin-card.dark .s{color:#C6D7E4}.fin-card.dark .v{color:#fff}.fin-card.indigo{background:#F2F3FF;border-color:#D8DAF7}.fin-card.orange{background:#FFF8EA;border-color:#F1DEB8}.fin-card.green{background:#F0FAF5;border-color:#D4EBDD}.fin-section{background:#fff;border:1px solid var(--fin-line);border-radius:16px;margin-top:12px;box-shadow:0 8px 24px rgba(15,42,67,.05);overflow:hidden}.fin-section>header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:13px 15px;background:#F7F9FC;border-bottom:1px solid var(--fin-line)}.fin-section h2{font:800 12px Montserrat;color:var(--fin-navy);margin:0}.fin-section header p{font-size:8.8px;color:var(--fin-muted);margin:4px 0 0}.fin-body{padding:14px 15px}.fin-table-wrap{overflow:auto}.fin-table{width:100%;border-collapse:collapse;min-width:760px}.fin-table th{font:700 7.8px Montserrat;text-transform:uppercase;letter-spacing:.04em;color:#667B8D;text-align:left;padding:8px;border-bottom:1px solid #DDE5EC;background:#FAFCFE;white-space:nowrap}.fin-table td{font-size:8.9px;color:#38536A;padding:8px;border-bottom:1px solid #EDF1F5;vertical-align:top}.fin-table td strong{color:var(--fin-navy)}.money{text-align:right;white-space:nowrap}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font:700 7.5px Montserrat;white-space:nowrap}.b-ok{background:#E5F6EE;color:#176B48}.b-warn{background:#FFF0C9;color:#845B00}.b-bad{background:#FDE9E8;color:#9B2F2B}.b-neutral{background:#EAF0F7;color:#536A7E}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare-box{border-radius:14px;padding:13px;border:1px solid #DDE5EC;background:#FBFCFE}.compare-box h3{font:800 10px Montserrat;color:var(--fin-navy);margin:0 0 8px}.metric-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #EDF1F5;font-size:9px;color:#536B7E}.metric-line:last-child{border:0}.metric-line b{color:var(--fin-navy)}.notice{padding:10px 12px;border-radius:11px;background:#FFF9EC;border:1px solid #F1DEB4;border-left:4px solid var(--fin-orange);font-size:9px;line-height:1.5;color:#6E5B32;margin-top:10px}.notice.blue{background:#F1F5FF;border-color:#D6DDF8;border-left-color:var(--fin-indigo);color:#455A7D}.section-title{font:800 15px Montserrat;color:var(--fin-navy);margin:14px 0 4px}.section-lead{font-size:9.5px;color:var(--fin-muted);margin:0 0 10px}.progress{height:8px;background:#E9EFF4;border-radius:999px;overflow:hidden;margin-top:7px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#484DCF,#174C78);border-radius:999px}.kpi-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.kpi-mini .mini{border:1px solid #E0E7ED;border-radius:12px;padding:10px;background:#FBFCFE}.mini b{display:block;font:800 14px Montserrat;color:var(--fin-navy)}.mini span{font-size:8px;color:var(--fin-muted)}.empty{padding:20px;text-align:center;color:var(--fin-muted);font-size:10px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;color:#61788A}.wrap{white-space:normal;min-width:180px}@media(max-width:1050px){.fin-grid,.kpi-mini{grid-template-columns:repeat(2,1fr)}.compare{grid-template-columns:1fr}}@media(max-width:620px){.fin-grid,.kpi-mini{grid-template-columns:1fr}.fin-tabs{top:58px}}
</style></head><body>
<div class="ym-main"><header class="ym-topbar"><div style="display:flex;align-items:center;gap:10px"><button id="ymMenu" class="ym-mobile-toggle">☰</button><div class="ym-topbar-title">FINANCEIRO</div></div><div class="ym-topbar-meta"><span class="ym-chip stage">PRODUÇÃO ASSISTIDA</span><span class="ym-chip">ETAPA 3</span></div></header>
<main class="ym-content"><div class="ym-header"><div><div class="ym-eyebrow">YM · ETAPA 3 · FINANCEIRO INTERNO</div><h1 class="ym-title">Quadro financeiro oficial</h1><p class="ym-lead">A planilha oficial está dentro do ambiente interno. O CRM alimenta o realizado; a estrutura, premissas e cenários continuam seguindo o quadro financeiro oficial.</p></div><div class="ym-actions"><button id="refresh" class="ym-btn secondary">Atualizar</button></div></div>
<div id="app"><div class="ym-empty">Carregando Financeiro…</div></div></main></div>
<script src="/assets/internal-shell.js"></script><script>
const $=id=>document.getElementById(id),S=v=>YM.esc(v),N=v=>Number(v||0),BRL=v=>N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),PCT=v=>(N(v)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',PCT100=v=>N(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',MONTH=v=>new Date(String(v)+'T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
let data=null;
async function api(){const s=await YM.requireSession('/FINANCEIRO');if(!s)throw new Error('Sessão necessária');const r=await fetch(YM.SUPABASE_URL+'/functions/v1/finance-dashboard',{headers:{Authorization:'Bearer '+s.access_token,apikey:YM.PUBLISHABLE_KEY}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha no Financeiro');return j}
const badge=(t,type='neutral')=>`<span class="badge b-${type}">${S(t)}</span>`;
const farol=x=>x==='EXCELENTE'?badge('🟢🟢 Excelente','ok'):x==='SAUDAVEL'?badge('🟢 Saudável','ok'):badge('🟡 Atenção','warn');
function table(headers,rows,min='760px'){return `<div class="fin-table-wrap"><table class="fin-table" style="min-width:${min}"><thead><tr>${headers.map(h=>`<th class="${h.money?'money':''}">${S(h.label)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function tabButton(id,label,active=false){return `<button class="fin-tab ${active?'active':''}" data-tab="${id}">${S(label)}</button>`}
function render(){const o=data.official||{},s=data.summary||{},c=data.current_month||{},av=data.actual_vs_official||{},source=data.source_of_truth||{};const projection=o.projection_monthly||[],actuals=data.monthly_actuals||[],actualMap=new Map(actuals.map(x=>[String(x.month),x]));
const currentPlan=projection.find(x=>String(x.month)===String(c.month));
$('app').innerHTML=`
<div class="fin-source"><b>FONTE DE VERDADE · ${S(source.file||'Planilha oficial')}</b><p>${S(source.rule||'')}<br>Abas incorporadas: ${(source.tabs||[]).map(S).join(' · ')}</p></div>
<div class="fin-grid">
 <div class="fin-card indigo"><div class="k">Plano oficial · mês</div><div class="v">${BRL(currentPlan?.planned_revenue||0)}</div><div class="s">Receita planejada na aba Projeção Mensal.</div></div>
 <div class="fin-card orange"><div class="k">Contratado · CRM</div><div class="v">${BRL(c.contratado)}</div><div class="s">Compromissos comerciais ativos.</div></div>
 <div class="fin-card"><div class="k">Faturado · CRM</div><div class="v">${BRL(c.faturado)}</div><div class="s">Cobranças registradas no mês.</div></div>
 <div class="fin-card dark"><div class="k">Recebido · CRM</div><div class="v">${BRL(c.recebido)}</div><div class="s">Valor efetivamente registrado como pago.</div></div>
</div>
${av?`<div class="fin-section"><header><div><h2>Plano oficial × realizado</h2><p>Leitura do mês atual sem misturar projeção com dinheiro realizado.</p></div>${badge(PCT100(av.attainment_pct)+' da meta','neutral')}</header><div class="fin-body"><div class="compare"><div class="compare-box"><h3>Planilha oficial</h3><div class="metric-line"><span>Receita planejada</span><b>${BRL(av.planned_revenue)}</b></div><div class="metric-line"><span>Resultado econômico planejado</span><b>${BRL(av.planned_economic_result)}</b></div></div><div class="compare-box"><h3>CRM / realizado</h3><div class="metric-line"><span>Recebido</span><b>${BRL(av.received)}</b></div><div class="metric-line"><span>Diferença para o plano</span><b>${BRL(av.revenue_gap)}</b></div><div class="progress"><span style="width:${Math.min(100,Math.max(0,N(av.attainment_pct)))}%"></span></div></div></div></div></div>`:''}
<div class="fin-tabs">${tabButton('dashboard','Dashboard',true)}${tabButton('premissas','Premissas')}${tabButton('produtos','Produtos')}${tabButton('capacidade','Capacidade')}${tabButton('visao','Visão Geral')}${tabButton('projecao','Projeção Mensal')}${tabButton('roi','ROI Mensal')}${tabButton('valuation','Valuation')}</div>
<section id="p-dashboard" class="fin-panel active">${renderDashboard(o,s)}</section>
<section id="p-premissas" class="fin-panel">${renderPremissas()}</section>
<section id="p-produtos" class="fin-panel">${renderProdutos()}</section>
<section id="p-capacidade" class="fin-panel">${renderCapacidade()}</section>
<section id="p-visao" class="fin-panel">${renderVisao(o.scenarios||[])}</section>
<section id="p-projecao" class="fin-panel">${renderProjecao(projection,actualMap)}</section>
<section id="p-roi" class="fin-panel">${renderROI(o.roi_monthly||[])}</section>
<section id="p-valuation" class="fin-panel">${renderValuation(o.valuation||[])}</section>`;
 document.querySelectorAll('.fin-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fin-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.fin-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('p-'+b.dataset.tab).classList.add('active')});
}
function renderDashboard(o,s){const k=o.dashboard_kpis||[],pay=o.dashboard_payback||[];return `<div class="section-title">Dashboard oficial</div><p class="section-lead">Espelho dos indicadores centrais da aba Dashboard.</p><div class="kpi-mini">${k.map(x=>`<div class="mini"><b>${x.unit==='R$'?BRL(x.numeric_value):N(x.numeric_value).toLocaleString('pt-BR')}</b><span>${S(x.label)}${x.unit&&x.unit!=='R$'?' · '+S(x.unit):''}</span></div>`).join('')}</div><div class="fin-section"><header><div><h2>Produtos · margem e farol</h2><p>Mesma lógica da aba Dashboard, alimentada pela matriz oficial de Produtos.</p></div></header><div class="fin-body">${table([{label:'Produto'},{label:'Preço',money:true},{label:'Margem',money:true},{label:'Farol'}],(data.products||[]).map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.reference_price)}</td><td class="money">${PCT(x.margin)}</td><td>${farol(x.farol)}</td></tr>`))}</div></div><div class="fin-section"><header><div><h2>Payback dos produtos-chave</h2><p>Quantidade de vendas para recuperar os R$ 23 mil do investimento histórico.</p></div></header><div class="fin-body">${table([{label:'Produto'},{label:'Contribuição/venda',money:true},{label:'Vendas p/ R$ 23 mil',money:true}],pay.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money"><strong>${N(x.sales_to_recover_23000).toLocaleString('pt-BR')}</strong></td></tr>`))}</div></div>`}
function renderPremissas(){return `<div class="section-title">Premissas financeiras</div><p class="section-lead">Valores oficiais da aba Premissas. Os campos calculados continuam calculados no sistema.</p><div class="fin-section"><header><div><h2>Premissas</h2><p>Custos de hora, comercial, provisão, investimento, meta e valuation.</p></div></header><div class="fin-body">${table([{label:'Premissa'},{label:'Valor',money:true},{label:'Unidade'},{label:'Fonte / observação'}],(data.assumptions||[]).map(x=>`<tr><td><strong>${S(x.label)}</strong></td><td class="money">${N(x.numeric_value).toLocaleString('pt-BR',{maximumFractionDigits:4})}</td><td>${S(x.unit||'—')}</td><td class="wrap">${S(x.source_note||'—')}</td></tr>`))}</div></div><div class="fin-section"><header><div><h2>Custos mensais da YM</h2><p>Itens e valores trazidos da planilha oficial.</p></div><strong>${BRL(data.summary?.cash_cost_monthly||0)}</strong></header><div class="fin-body">${table([{label:'Item'},{label:'Valor mensal',money:true},{label:'Tipo'},{label:'Status / fonte'}],(data.costs||[]).map(x=>`<tr><td><strong>${S(x.item_name)}</strong></td><td class="money">${BRL(x.monthly_value)}</td><td>${S(x.cost_type)}</td><td class="wrap">${S(x.status_source||'—')}</td></tr>`))}</div></div>`}
function renderProdutos(){return `<div class="section-title">Unit economics por produto</div><p class="section-lead">Reprodução da aba Produtos: tempo, preço, custos, contribuição, margem e farol.</p><div class="fin-section"><header><div><h2>Produtos</h2><p>Matriz financeira oficial.</p></div></header><div class="fin-body">${table([{label:'Produto'},{label:'Tempo h',money:true},{label:'Preço',money:true},{label:'Custo tempo',money:true},{label:'Custo variável',money:true},{label:'Custo entrega',money:true},{label:'Contribuição/venda',money:true},{label:'Margem',money:true},{label:'Contribuição/h',money:true},{label:'Vendas p/ cobrir mês',money:true},{label:'Farol'}],(data.products||[]).map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.reference_price)}</td><td class="money">${BRL(x.time_cost)}</td><td class="money">${BRL(x.variable_cost)}</td><td class="money">${BRL(x.delivery_cost)}</td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money">${PCT(x.margin)}</td><td class="money">${BRL(x.contribution_per_hour)}</td><td class="money">${N(x.sales_to_cover_month).toLocaleString('pt-BR')}</td><td>${farol(x.farol)}</td></tr>`),'1280px')}</div></div>`}
function renderCapacidade(){const s=data.summary||{};return `<div class="section-title">Capacidade mensal de execução</div><p class="section-lead">Aba Capacidade incorporada com as premissas de horas e reserva operacional.</p><div class="kpi-mini"><div class="mini"><b>${N(s.productive_hours).toLocaleString('pt-BR')}</b><span>Horas produtivas totais/mês</span></div><div class="mini"><b>${N(s.commercial_hours).toLocaleString('pt-BR')}</b><span>Horas comerciais/mês</span></div><div class="mini"><b>${N(s.delivery_hours).toLocaleString('pt-BR')}</b><span>Horas entrega disponíveis/mês</span></div><div class="mini"><b>${N(s.vendable_hours).toLocaleString('pt-BR')}</b><span>Horas vendáveis planejadas/mês</span></div></div><div class="fin-section"><header><div><h2>Capacidade por produto</h2><p>Teórica e recomendada, receita e contribuição potencial.</p></div></header><div class="fin-body">${table([{label:'Produto'},{label:'Horas/venda',money:true},{label:'Preço',money:true},{label:'Contribuição/venda',money:true},{label:'Horas entrega/mês',money:true},{label:'Cap. teórica',money:true},{label:'Cap. recomendada',money:true},{label:'Receita potencial',money:true},{label:'Contribuição potencial',money:true},{label:'Observação'}],(data.products||[]).map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.reference_price)}</td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money">${N(x.delivery_hours).toLocaleString('pt-BR')}</td><td class="money">${N(x.theoretical_capacity_month).toLocaleString('pt-BR')}</td><td class="money"><strong>${N(x.recommended_capacity_month).toLocaleString('pt-BR')}</strong></td><td class="money">${BRL(x.revenue_recommended)}</td><td class="money">${BRL(x.contribution_recommended)}</td><td>${S(x.capacity_note||'—')}</td></tr>`),'1250px')}</div></div>`}
function renderVisao(rows){return `<div class="section-title">Visão financeira completa</div><p class="section-lead">Cenários oficiais de operação daqui pra frente, sem carregar o investimento antigo no custo mensal.</p><div class="fin-section"><header><div><h2>Cenários da planilha</h2><p>Mix, horas, receita, caixa, economia e capacidade.</p></div></header><div class="fin-body">${table([{label:'Cenário'},{label:'Mix mensal'},{label:'Horas entrega',money:true},{label:'Receita',money:true},{label:'Contribuição',money:true},{label:'Resultado caixa',money:true},{label:'Margem caixa',money:true},{label:'Resultado econômico',money:true},{label:'Margem econômica',money:true},{label:'Capacidade'}],rows.map(x=>`<tr><td><strong>${S(x.scenario_name)}</strong></td><td class="wrap">${S(x.mix_monthly)}</td><td class="money">${N(x.delivery_hours).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.revenue)}</td><td class="money">${BRL(x.product_contribution)}</td><td class="money">${BRL(x.cash_result)}</td><td class="money">${PCT(x.cash_margin)}</td><td class="money"><strong>${BRL(x.economic_result)}</strong></td><td class="money">${PCT(x.economic_margin)}</td><td>${x.capacity_status.includes('✅')?badge(x.capacity_status,'ok'):badge(x.capacity_status,'warn')}</td></tr>`),'1250px')}</div></div><div class="notice blue"><b>Investimento histórico × operação corrente:</b> os R$ 23 mil servem para payback/ROI histórico. Eles não são somados novamente ao custo mensal da operação.</div>`}
function renderProjecao(rows,actualMap){return `<div class="section-title">Projeção mensal daqui pra frente</div><p class="section-lead">Plano oficial de agosto/2026 a julho/2027, agora comparável ao realizado do CRM.</p><div class="fin-section"><header><div><h2>Plano oficial × CRM</h2><p>A coluna Planejado vem da planilha; Contratado/Faturado/Recebido vêm do sistema.</p></div></header><div class="fin-body">${table([{label:'Mês'},{label:'Planejado',money:true},{label:'Contratado CRM',money:true},{label:'Faturado CRM',money:true},{label:'Recebido CRM',money:true},{label:'Contribuição plano',money:true},{label:'Resultado caixa plano',money:true},{label:'Resultado econômico plano',money:true},{label:'Saldo histórico',money:true},{label:'ROI histórico',money:true},{label:'Horas entrega',money:true},{label:'Utilização',money:true},{label:'Status'}],rows.map(x=>{const a=actualMap.get(String(x.month))||{};return `<tr><td><strong>${MONTH(x.month)}</strong></td><td class="money"><strong>${BRL(x.planned_revenue)}</strong></td><td class="money">${BRL(a.contratado)}</td><td class="money">${BRL(a.faturado)}</td><td class="money">${BRL(a.recebido)}</td><td class="money">${BRL(x.product_contribution)}</td><td class="money">${BRL(x.cash_result)}</td><td class="money">${BRL(x.economic_result)}</td><td class="money">${BRL(x.historical_balance_to_recover)}</td><td class="money">${PCT(x.historical_roi_accumulated)}</td><td class="money">${N(x.delivery_hours).toLocaleString('pt-BR')}</td><td class="money">${PCT(x.capacity_utilization)}</td><td>${badge(x.status,'warn')}</td></tr>`}),'1500px')}</div></div>`}
function renderROI(rows){const productNames=['Raio-X Estratégico','LinkedIn','WhatsApp Business','Instagram','Página de Vendas','Fundação Essencial','Funil de Vendas','Estratégia de Lançamento','Site','Negócio do Zero Essencial','Fábrica Profissional','Campanha Completa','Fundação 3 meses','Negócio do Zero Completo','Fábrica Equipe','Fundação 6 meses'];return `<div class="section-title">ROI, payback e resultado mês a mês</div><p class="section-lead">Espelho da aba ROI Mensal, de março/2026 a dezembro/2027.</p><div class="notice">Na planilha oficial atual, as quantidades dos 16 produtos estão zeradas nessa aba; por isso o resultado econômico mensal permanece em -R$ 5.134,28 até que o mix seja preenchido. Os dados foram mantidos exatamente assim.</div><div class="fin-section"><header><div><h2>ROI mensal oficial</h2><p>Resultado, acumulado, saldo de investimento e ROI acumulado.</p></div></header><div class="fin-body">${table([{label:'Mês'},{label:'Receita',money:true},{label:'Contribuição',money:true},{label:'Custo fixo',money:true},{label:'Custo comercial',money:true},{label:'Resultado econômico',money:true},{label:'Resultado acumulado',money:true},{label:'Saldo investimento',money:true},{label:'ROI acumulado',money:true}],rows.map(x=>`<tr><td><strong>${MONTH(x.month)}</strong></td><td class="money">${BRL(x.revenue)}</td><td class="money">${BRL(x.product_contribution)}</td><td class="money">${BRL(x.fixed_cash_cost)}</td><td class="money">${BRL(x.commercial_cost)}</td><td class="money">${BRL(x.economic_result)}</td><td class="money">${BRL(x.accumulated_result)}</td><td class="money">${BRL(x.investment_balance)}</td><td class="money">${PCT(x.accumulated_roi)}</td></tr>`),'1100px')}</div></div><details class="fin-section"><summary style="padding:13px 15px;font:800 10px Montserrat;color:var(--fin-navy);cursor:pointer">Ver as 16 colunas de mix preservadas</summary><div class="fin-body"><p class="section-lead">${productNames.map(S).join(' · ')}</p><div class="formula">Todos os produtos = 0 em todos os meses da versão oficial importada.</div></div></details>`}
function renderValuation(rows){return `<div class="section-title">Valuation gerencial</div><p class="section-lead">Cenário oficial da planilha. Referência de gestão, não laudo formal.</p><div class="fin-section"><header><div><h2>Valuation</h2><p>Indicador, fórmula/premissa, valor e observação.</p></div></header><div class="fin-body">${table([{label:'Indicador'},{label:'Fórmula / premissa'},{label:'Valor',money:true},{label:'Observação'}],rows.map(x=>`<tr><td><strong>${S(x.indicator)}</strong></td><td class="formula">${S(x.formula_premise||'—')}</td><td class="money"><strong>${BRL(x.numeric_value)}</strong></td><td class="wrap">${S(x.observation||'—')}</td></tr>`))}</div></div><div class="notice blue">Para valuation formal, a própria planilha determina consolidar histórico de receita/lucro, recorrência, concentração de clientes e dependência da fundadora.</div>`}
async function load(){try{data=await api();YM.shell('FINANCEIRO',data.user);render()}catch(e){$('app').innerHTML=`<div class="ym-empty">${S(e.message)}</div>`;YM.toast(e.message,true)}}
$('refresh').onclick=load;load();
</script></body></html>
