<style>
:root{--n:#0A2540;--i:#484DCF;--o:#F59E0B;--g:#138A60;--r:#B83D3D;--line:#DDE6EE;--muted:#657B8F;--bg:#F7F9FC}
.fin-status{display:inline-flex;align-items:center;gap:6px;border:1px solid #F1DEB8;background:#FFF8EA;color:#7B590D;border-radius:999px;padding:6px 9px;font:700 9px Montserrat;margin-bottom:10px}.fin-status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--o)}
.fin-tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 11px;position:sticky;top:61px;background:var(--bg);z-index:9;scrollbar-width:none}.fin-tabs::-webkit-scrollbar{display:none}.fin-tab{border:1px solid #D6E0EA;background:#fff;color:#536B7E;border-radius:999px;padding:9px 12px;font:700 9px Montserrat;white-space:nowrap;cursor:pointer}.fin-tab.active{background:var(--n);border-color:var(--n);color:#fff}.fin-panel{display:none}.fin-panel.active{display:block}
.filter-box{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 14px;margin-bottom:11px;box-shadow:0 7px 20px rgba(15,42,67,.04)}.filter-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}.filter-head strong{font:800 11px Montserrat;color:var(--n)}.filter-head span{font-size:9px;color:var(--muted)}.preset-row{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.preset-row::-webkit-scrollbar{display:none}.preset{border:1px solid #D9E2E9;background:#F9FBFD;color:#587084;border-radius:999px;padding:7px 10px;font:700 8.5px Montserrat;white-space:nowrap;cursor:pointer}.preset.active{background:#EEF0FF;color:var(--i);border-color:#C9CCF7}.custom-range{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.custom-range.show{display:grid}.custom-range label{font:700 8px Montserrat;color:var(--muted);text-transform:uppercase}.custom-range input{width:100%;box-sizing:border-box;margin-top:4px;border:1px solid #D5E0E8;border-radius:10px;padding:9px 10px;background:#fff;color:var(--n);font:600 11px Inter}.period-pill{display:inline-flex;margin-top:9px;padding:5px 8px;border-radius:999px;background:#EDF3F8;color:#486478;font:700 8.5px Montserrat}
.hero{background:linear-gradient(135deg,#071F36 0%,#103E63 60%,#484DCF 135%);color:#fff;border-radius:22px;padding:22px;box-shadow:0 16px 40px rgba(10,37,64,.17);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-95px;top:-110px;background:rgba(255,255,255,.06)}.hero-eyebrow{font:700 9px Montserrat;letter-spacing:.1em;text-transform:uppercase;color:#B8CEDD}.hero h2{font:800 18px Montserrat;margin:6px 0 0;line-height:1.3;max-width:760px}.hero-value{font:800 42px Montserrat;letter-spacing:-.04em;line-height:1;margin:16px 0 5px}.hero-label{font-size:12px;color:#D3E3EE}.hero-progress{height:9px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;margin:14px 0 6px;max-width:780px}.hero-progress span{display:block;height:100%;background:#fff;border-radius:999px}.hero-progress-label{font-size:10px;color:#D4E3ED}.hero-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;max-width:900px}.hero-metric{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.11);border-radius:13px;padding:11px}.hero-metric span{display:block;font:700 8px Montserrat;color:#BFD2E0;text-transform:uppercase;letter-spacing:.05em}.hero-metric b{display:block;font:800 17px Montserrat;color:#fff;margin-top:5px}.hero-note{font-size:10px;line-height:1.5;color:#C9DBE7;margin-top:11px;max-width:900px}
.section{background:#fff;border:1px solid var(--line);border-radius:17px;margin-top:12px;overflow:hidden;box-shadow:0 7px 22px rgba(15,42,67,.04)}.section>header{padding:13px 15px;background:#FAFCFE;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.section h2{font:800 12px Montserrat;color:var(--n);margin:0}.section header p{font-size:9px;color:var(--muted);margin:4px 0 0;line-height:1.45}.section-body{padding:14px 15px}.section-title{font:800 17px Montserrat;color:var(--n);margin:5px 0 3px}.section-lead{font-size:10.5px;color:var(--muted);line-height:1.5;margin:0 0 11px}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.metric .k{font:700 8px Montserrat;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.metric .v{font:800 20px Montserrat;color:var(--n);margin-top:5px}.metric .d{font-size:9px;color:#60788B;margin-top:4px;line-height:1.45}.metric.indigo{background:#F3F3FF;border-color:#D9DAF5}.metric.orange{background:#FFF8EB;border-color:#F0DFBB}.metric.green{background:#F0F9F5;border-color:#D6EADF}.metric.dark{background:var(--n);border-color:var(--n)}.metric.dark .k,.metric.dark .d{color:#BCD0DF}.metric.dark .v{color:#fff}
.period-summary{display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.summary-card{border:1px solid #DFE7ED;background:#FBFCFE;border-radius:14px;padding:13px}.summary-card strong{display:block;font:800 14px Montserrat;color:var(--n)}.summary-card span{display:block;font-size:9.5px;color:#5D7588;margin-top:4px;line-height:1.5}.summary-card.emphasis{background:#F3F3FF;border-color:#D8DAF4}
.trend-list{display:grid;gap:9px}.trend-month{display:grid;grid-template-columns:90px 1fr 115px;gap:11px;align-items:center;border-bottom:1px solid #EDF1F4;padding:8px 0}.trend-month:last-child{border-bottom:0}.trend-month .m{font:800 9px Montserrat;color:var(--n);text-transform:uppercase}.bars{display:grid;gap:5px}.bar-line{display:grid;grid-template-columns:66px 1fr;gap:6px;align-items:center}.bar-line label{font-size:8px;color:#6A8092}.bar{height:6px;background:#EDF1F5;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;border-radius:999px}.bar .rec{background:var(--n)}.bar .con{background:var(--i)}.bar .meta{background:#D9B15D}.trend-values{font-size:8.5px;color:#62798C;text-align:right;line-height:1.65}.trend-values b{color:var(--n)}
.insight-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.insight{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.insight .tag{font:700 8px Montserrat;color:var(--i);text-transform:uppercase;letter-spacing:.05em}.insight strong{display:block;font:800 13px Montserrat;color:var(--n);margin-top:5px}.insight span{display:block;font-size:9px;color:#60788B;margin-top:4px;line-height:1.45}
.scenario-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.scenario{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.scenario h3{font:800 11px Montserrat;color:var(--n);margin:0}.scenario p{font-size:9px;color:#60788B;line-height:1.45;margin:4px 0 8px}.scenario .minirow{display:flex;justify-content:space-between;gap:10px;padding-top:5px;font-size:8.5px;color:#677D8F}.scenario .minirow b{color:var(--n)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th{font:700 7.8px Montserrat;text-transform:uppercase;letter-spacing:.04em;color:#667B8D;text-align:left;padding:8px;background:#FAFCFE;border-bottom:1px solid #DDE5EC;white-space:nowrap}.table td{font-size:8.9px;color:#38536A;padding:8px;border-bottom:1px solid #EDF1F5;vertical-align:top}.table td strong{color:var(--n)}.money{text-align:right;white-space:nowrap}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font:700 7.5px Montserrat;white-space:nowrap}.ok{background:#E5F6EE;color:#176B48}.warn{background:#FFF0C9;color:#845B00}.bad{background:#FDE9E8;color:#9B2F2B}.neutral{background:#EAF0F7;color:#536A7E}
.source-box{background:linear-gradient(135deg,#0A2540,#174C78);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px}.source-box strong{font:800 10px Montserrat}.source-box p{font-size:9px;line-height:1.5;color:#D3E2EC;margin:5px 0 0}.sheet{border:1px solid #E0E7ED;border-radius:13px;margin-bottom:9px;overflow:hidden;background:#fff}.sheet>summary{cursor:pointer;list-style:none;padding:12px 13px;font:800 10px Montserrat;color:var(--n);background:#F9FBFD}.sheet>summary::-webkit-details-marker{display:none}.sheet[open]>summary{border-bottom:1px solid #E3E9EE}.sheet-body{padding:10px}.source-note{font-size:9px;color:#60788B;line-height:1.5;background:#F4F7FA;padding:9px 11px;border-radius:10px;margin-top:9px}
@media(max-width:1050px){.metric-grid,.insight-grid{grid-template-columns:repeat(2,1fr)}.hero-metrics{grid-template-columns:repeat(3,1fr)}.period-summary,.scenario-grid{grid-template-columns:1fr}}
@media(max-width:620px){.fin-tabs{top:57px}.filter-head{display:block}.filter-head span{display:block;margin-top:3px}.custom-range{grid-template-columns:1fr 1fr}.hero{padding:18px 16px;border-radius:18px}.hero h2{font-size:15px}.hero-value{font-size:34px}.hero-metrics,.metric-grid,.insight-grid{grid-template-columns:1fr}.hero-metric{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.hero-metric b{margin:0;font-size:15px}.trend-month{grid-template-columns:1fr;gap:6px;border:1px solid #E4EAF0;border-radius:12px;padding:10px}.trend-values{text-align:left;display:flex;gap:10px;flex-wrap:wrap}.bar-line{grid-template-columns:58px 1fr}.section>header{display:block}.section>header .badge{margin-top:7px}.ym-header .ym-lead{font-size:11px}.section-title{font-size:15px}}
</style></head><body>
<div class="ym-main"><header class="ym-topbar"><div style="display:flex;align-items:center;gap:10px"><button id="ymMenu" class="ym-mobile-toggle">☰</button><div class="ym-topbar-title">FINANCEIRO</div></div><div class="ym-topbar-meta"><span class="ym-chip stage">PRODUÇÃO ASSISTIDA</span><span class="ym-chip">ETAPA 3</span></div></header>
<main class="ym-content"><div class="ym-header"><div><div class="ym-eyebrow">YM · ETAPA 3 · FINANCEIRO INTERNO</div><h1 class="ym-title">Financeiro da YM</h1><p class="ym-lead">A home mostra a manchete. As análises de produto, capacidade, planejamento e valuation ficam em visões próprias.</p></div><div class="ym-actions"><button id="refresh" class="ym-btn secondary">Atualizar</button></div></div>
<div id="app"><div class="ym-empty">Carregando Financeiro…</div></div></main></div>
<script src="/assets/internal-shell.js"></script><script>
const $=id=>document.getElementById(id),S=v=>YM.esc(v),N=v=>Number(v||0),BRL=v=>N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),PCT=v=>(N(v)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',PCT100=v=>N(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',MONTH=v=>new Date(String(v)+'T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}),MONTHLONG=v=>new Date(String(v)+'T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
let data=null;
const currentMonth=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`};
const addMonths=(key,n)=>{const d=new Date(String(key)+'T12:00:00');d.setMonth(d.getMonth()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`};
const inputMonth=key=>String(key||'').slice(0,7),fromInput=v=>v?`${v}-01`:currentMonth();
const state={tab:'executiva',preset:'current',from:currentMonth(),to:currentMonth()};
async function api(){const s=await YM.requireSession('/FINANCEIRO');if(!s)throw new Error('Sessão necessária');const r=await fetch(YM.SUPABASE_URL+'/functions/v1/finance-dashboard',{headers:{Authorization:'Bearer '+s.access_token,apikey:YM.PUBLISHABLE_KEY}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha no Financeiro');return j}
const badge=(t,type='neutral')=>`<span class="badge ${type}">${S(t)}</span>`;
const table=(heads,rows,min='780px')=>`<div class="table-wrap"><table class="table" style="min-width:${min}"><thead><tr>${heads.map(h=>`<th class="${h.money?'money':''}">${S(h.label)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
function monthKeys(from,to){let out=[],k=from,guard=0;while(k<=to&&guard<120){out.push(k);k=addMonths(k,1);guard++}return out}
function periodLabel(){return state.from===state.to?MONTHLONG(state.from):`${MONTH(state.from)} → ${MONTH(state.to)}`}
function applyPreset(p){state.preset=p;const c=currentMonth();if(p==='current'){state.from=c;state.to=c}if(p==='3m'){state.from=addMonths(c,-2);state.to=c}if(p==='6m'){state.from=addMonths(c,-5);state.to=c}if(p==='12m'){state.from=addMonths(c,-11);state.to=c}if(p==='year'){state.from=`${c.slice(0,4)}-01-01`;state.to=c}if(p==='next3'){state.from=c;state.to=addMonths(c,2)}render()}
function filterBox(){return `<div class="filter-box"><div class="filter-head"><strong>Período da leitura</strong><span>A manchete e o planejamento respondem ao intervalo selecionado.</span></div><div class="preset-row"><button class="preset ${state.preset==='current'?'active':''}" data-preset="current">Mês atual</button><button class="preset ${state.preset==='3m'?'active':''}" data-preset="3m">3 meses</button><button class="preset ${state.preset==='6m'?'active':''}" data-preset="6m">6 meses</button><button class="preset ${state.preset==='12m'?'active':''}" data-preset="12m">12 meses</button><button class="preset ${state.preset==='year'?'active':''}" data-preset="year">Ano atual</button><button class="preset ${state.preset==='next3'?'active':''}" data-preset="next3">Próx. 3 meses</button><button class="preset ${state.preset==='custom'?'active':''}" data-preset="custom">Personalizado</button></div><div class="custom-range ${state.preset==='custom'?'show':''}"><label>De<input id="fromMonth" type="month" value="${inputMonth(state.from)}"></label><label>Até<input id="toMonth" type="month" value="${inputMonth(state.to)}"></label></div><span class="period-pill">${S(periodLabel())}</span></div>`}
function aggregates(){const s=data.summary||{},actuals=data.monthly_actuals||[],projection=data.official?.projection_monthly||[],keys=monthKeys(state.from,state.to),aset=new Map(actuals.map(x=>[String(x.month),x])),pset=new Map(projection.map(x=>[String(x.month),x]));let recebido=0,contratado=0,faturado=0,previsto=0,planejado=0;for(const k of keys){const a=aset.get(k)||{};const p=pset.get(k)||{};recebido+=N(a.recebido);contratado+=N(a.contratado);faturado+=N(a.faturado);previsto+=N(a.previsto);planejado+=N(p.planned_revenue)}const meta=N(s.monthly_revenue_target)*keys.length;const pct=meta>0?recebido/meta*100:0;const gap=Math.max(meta-recebido,0);const prevFrom=addMonths(state.from,-keys.length),prevTo=addMonths(state.to,-keys.length);let recebidoAnterior=0;for(const a of actuals){const k=String(a.month);if(k>=prevFrom&&k<=prevTo)recebidoAnterior+=N(a.recebido)}return{keys,aset,pset,recebido,contratado,faturado,previsto,planejado,meta,pct,gap,recebidoAnterior,delta:recebido-recebidoAnterior}}
function tabs(){const items=[['executiva','Visão Executiva'],['produtos','Produtos'],['capacidade','Capacidade'],['planejamento','Planejamento'],['valuation','Valuation'],['oficial','Base Oficial']];return `<div class="fin-tabs">${items.map(([id,l])=>`<button class="fin-tab ${state.tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</div>`}
function executive(){const a=aggregates(),max=Math.max(a.meta,...a.keys.map(k=>Math.max(N(a.aset.get(k)?.recebido),N(a.aset.get(k)?.contratado),N(a.pset.get(k)?.planned_revenue))),1);const trend=a.keys.map(k=>{const x=a.aset.get(k)||{},p=a.pset.get(k)||{},meta=N(data.summary?.monthly_revenue_target);return `<div class="trend-month"><div class="m">${MONTH(k)}</div><div class="bars"><div class="bar-line"><label>Recebido</label><div class="bar"><span class="rec" style="width:${Math.min(100,N(x.recebido)/max*100)}%"></span></div></div><div class="bar-line"><label>Contratado</label><div class="bar"><span class="con" style="width:${Math.min(100,N(x.contratado)/max*100)}%"></span></div></div><div class="bar-line"><label>Meta</label><div class="bar"><span class="meta" style="width:${Math.min(100,meta/max*100)}%"></span></div></div></div><div class="trend-values"><span>R <b>${BRL(x.recebido)}</b></span><span>C <b>${BRL(x.contratado)}</b></span><span>M <b>${BRL(meta)}</b></span></div></div>`}).join('');const deltaText=a.recebidoAnterior===0?(a.recebido>0?'Há receita no período; a base anterior equivalente foi zero.':'Ainda não há receita registrada nesse intervalo.'):a.delta===0?'O recebido ficou estável contra o período anterior equivalente.':`${a.delta>0?'Acima':'Abaixo'} do período anterior em ${BRL(Math.abs(a.delta))}.`;return `${filterBox()}<section class="hero"><div class="hero-eyebrow">MANCHETE · ${S(periodLabel())}</div><h2>A YM recebeu no período</h2><div class="hero-value">${BRL(a.recebido)}</div><div class="hero-label">de uma meta acumulada de ${BRL(a.meta)}</div><div class="hero-progress"><span style="width:${Math.min(100,Math.max(0,a.pct))}%"></span></div><div class="hero-progress-label">${PCT100(a.pct)} da meta do período</div><div class="hero-metrics"><div class="hero-metric"><span>Já contratado</span><b>${BRL(a.contratado)}</b></div><div class="hero-metric"><span>Faturado</span><b>${BRL(a.faturado)}</b></div><div class="hero-metric"><span>Falta para a meta</span><b>${BRL(a.gap)}</b></div></div><div class="hero-note">${S(deltaText)}${a.planejado>0?` Plano oficial acumulado: ${BRL(a.planejado)}.`:''}</div></section><div class="section"><header><div><h2>Leitura rápida do período</h2><p>Três respostas para entender a situação sem abrir os detalhes técnicos.</p></div></header><div class="section-body"><div class="period-summary"><div class="summary-card emphasis"><strong>${a.pct>=100?'Meta atingida ou superada':`${PCT100(a.pct)} da meta já entrou`}</strong><span>Recebido: ${BRL(a.recebido)} · Gap: ${BRL(a.gap)}.</span></div><div class="summary-card"><strong>${BRL(a.contratado)}</strong><span>Valor comercialmente contratado dentro do período selecionado.</span></div></div></div></div><div class="section"><header><div><h2>Evolução do período</h2><p>Recebido, contratado e meta mensal lado a lado.</p></div></header><div class="section-body"><div class="trend-list">${trend||'<div class="source-note">Sem meses no intervalo.</div>'}</div></div></div>`}
function productsPanel(){const p=data.products||[];const bySale=[...p].sort((a,b)=>N(b.contribution_per_sale)-N(a.contribution_per_sale))[0],byHour=[...p].sort((a,b)=>N(b.contribution_per_hour)-N(a.contribution_per_hour))[0],byMargin=[...p].sort((a,b)=>N(b.margin)-N(a.margin))[0],attention=[...p].sort((a,b)=>N(a.margin)-N(b.margin))[0];return `<div class="section-title">Produtos</div><p class="section-lead">Aqui a pergunta é: quais ofertas geram melhor resultado econômico e esforço?</p><div class="insight-grid"><div class="insight"><div class="tag">Maior contribuição/venda</div><strong>${S(bySale?.service_name||'—')}</strong><span>${BRL(bySale?.contribution_per_sale)} por venda.</span></div><div class="insight"><div class="tag">Melhor contribuição/hora</div><strong>${S(byHour?.service_name||'—')}</strong><span>${BRL(byHour?.contribution_per_hour)} por hora.</span></div><div class="insight"><div class="tag">Maior margem</div><strong>${S(byMargin?.service_name||'—')}</strong><span>${PCT(byMargin?.margin)} de margem.</span></div><div class="insight"><div class="tag">Menor margem</div><strong>${S(attention?.service_name||'—')}</strong><span>${PCT(attention?.margin)} · merece atenção comparativa.</span></div></div><div class="section"><header><div><h2>Economia por produto</h2><p>Preço, esforço, custo de entrega, contribuição e margem.</p></div></header><div class="section-body">${table([{label:'Produto'},{label:'Preço',money:true},{label:'Horas',money:true},{label:'Custo entrega',money:true},{label:'Contribuição/venda',money:true},{label:'Contribuição/hora',money:true},{label:'Margem',money:true},{label:'Farol'}],p.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.reference_price)}</td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.delivery_cost)}</td><td class="money"><strong>${BRL(x.contribution_per_sale)}</strong></td><td class="money">${BRL(x.contribution_per_hour)}</td><td class="money">${PCT(x.margin)}</td><td>${badge(x.farol,x.farol==='ATENCAO'?'warn':'ok')}</td></tr>`))}</div></div>`}
function capacityPanel(){const s=data.summary||{},p=data.products||[],sc=data.official?.scenarios||[];const byScale=[...p].sort((a,b)=>N(b.recommended_capacity_month)-N(a.recommended_capacity_month))[0];return `<div class="section-title">Capacidade</div><p class="section-lead">Aqui a pergunta é: quanto a YM consegue vender e entregar sem ultrapassar a estrutura atual?</p><div class="metric-grid"><div class="metric"><div class="k">Horas produtivas</div><div class="v">${N(s.productive_hours).toLocaleString('pt-BR')}h</div><div class="d">Disponibilidade produtiva mensal.</div></div><div class="metric"><div class="k">Horas comerciais</div><div class="v">${N(s.commercial_hours).toLocaleString('pt-BR')}h</div><div class="d">Tempo econômico dedicado ao comercial.</div></div><div class="metric indigo"><div class="k">Horas vendáveis</div><div class="v">${N(s.vendable_hours).toLocaleString('pt-BR')}h</div><div class="d">Após reserva operacional.</div></div><div class="metric green"><div class="k">Maior escala unitária</div><div class="v">${N(byScale?.recommended_capacity_month).toLocaleString('pt-BR')}</div><div class="d">${S(byScale?.service_name||'—')} por mês.</div></div></div><div class="section"><header><div><h2>Capacidade por produto</h2><p>Teórica × recomendada e potencial econômico.</p></div></header><div class="section-body">${table([{label:'Produto'},{label:'Horas/venda',money:true},{label:'Teórica/mês',money:true},{label:'Recomendada/mês',money:true},{label:'Receita potencial',money:true},{label:'Contribuição potencial',money:true},{label:'Leitura'}],p.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}</td><td class="money">${N(x.theoretical_capacity_month).toLocaleString('pt-BR')}</td><td class="money"><strong>${N(x.recommended_capacity_month).toLocaleString('pt-BR')}</strong></td><td class="money">${BRL(x.revenue_recommended)}</td><td class="money">${BRL(x.contribution_recommended)}</td><td>${S(x.capacity_note||'—')}</td></tr>`))}</div></div><div class="section"><header><div><h2>Cenários × capacidade</h2><p>Mix planejado e sinal de uso da capacidade na Visão Geral oficial.</p></div></header><div class="section-body"><div class="scenario-grid">${sc.map(x=>`<div class="scenario"><h3>${S(x.scenario_name)}</h3><p>${S(x.mix_monthly)}</p><div class="minirow"><span>Receita</span><b>${BRL(x.revenue)}</b></div><div class="minirow"><span>Horas de entrega</span><b>${N(x.delivery_hours).toLocaleString('pt-BR')}h</b></div><div class="minirow"><span>Capacidade</span><b>${S(x.capacity_status)}</b></div></div>`).join('')}</div></div></div>`}
function planningPanel(){const a=aggregates(),rows=a.keys.map(k=>{const x=a.aset.get(k)||{},p=a.pset.get(k)||{};return `<tr><td><strong>${MONTH(k)}</strong></td><td class="money">${BRL(p.planned_revenue)}</td><td class="money">${BRL(x.contratado)}</td><td class="money">${BRL(x.faturado)}</td><td class="money"><strong>${BRL(x.recebido)}</strong></td><td class="money">${BRL(Math.max(N(data.summary?.monthly_revenue_target)-N(x.recebido),0))}</td><td>${S(p.status||'—')}</td></tr>`});const sc=data.official?.scenarios||[];return `${filterBox()}<div class="section-title">Planejamento</div><p class="section-lead">Plano, vendas contratadas e realização financeira no período escolhido.</p><div class="metric-grid"><div class="metric indigo"><div class="k">Plano oficial</div><div class="v">${BRL(a.planejado)}</div><div class="d">Soma da Projeção Mensal.</div></div><div class="metric orange"><div class="k">Contratado</div><div class="v">${BRL(a.contratado)}</div><div class="d">Compromissos comerciais no período.</div></div><div class="metric dark"><div class="k">Recebido</div><div class="v">${BRL(a.recebido)}</div><div class="d">Dinheiro efetivamente registrado.</div></div><div class="metric"><div class="k">Gap para meta</div><div class="v">${BRL(a.gap)}</div><div class="d">Meta mensal acumulada menos recebido.</div></div></div><div class="section"><header><div><h2>Mês a mês</h2><p>Previsto ≠ contratado ≠ faturado ≠ recebido.</p></div></header><div class="section-body">${table([{label:'Mês'},{label:'Plano oficial',money:true},{label:'Contratado',money:true},{label:'Faturado',money:true},{label:'Recebido',money:true},{label:'Gap meta',money:true},{label:'Capacidade'}],rows)}</div></div><div class="section"><header><div><h2>Cenários oficiais</h2><p>Comparação dos mixes mensais da Visão Geral.</p></div></header><div class="section-body"><div class="scenario-grid">${sc.map(x=>`<div class="scenario"><h3>${S(x.scenario_name)}</h3><p>${S(x.mix_monthly)}</p><div class="minirow"><span>Receita</span><b>${BRL(x.revenue)}</b></div><div class="minirow"><span>Resultado econômico</span><b>${BRL(x.economic_result)}</b></div><div class="minirow"><span>Capacidade</span><b>${S(x.capacity_status)}</b></div></div>`).join('')}</div></div></div>`}
function valuationPanel(){const v=data.official?.valuation||[],map=new Map(v.map(x=>[x.metric_key,x])),cons=map.get('CONSERVATIVE_VALUATION'),sup=map.get('SUPERIOR_VALUATION'),floor=map.get('INTELLECTUAL_ASSET_FLOOR'),annual=map.get('ANNUALIZED_REVENUE'),result=map.get('ANNUAL_ECONOMIC_RESULT');return `<div class="section-title">Valuation</div><p class="section-lead">Aqui a pergunta é patrimonial: qual é a faixa gerencial de valor do negócio segundo as premissas oficiais?</p><div class="metric-grid"><div class="metric indigo"><div class="k">Valuation conservador</div><div class="v">${BRL(cons?.numeric_value)}</div><div class="d">${S(cons?.formula_premise||'—')}</div></div><div class="metric dark"><div class="k">Valuation superior</div><div class="v">${BRL(sup?.numeric_value)}</div><div class="d">${S(sup?.formula_premise||'—')}</div></div><div class="metric"><div class="k">Piso intelectual</div><div class="v">${BRL(floor?.numeric_value)}</div><div class="d">Investimento econômico de referência.</div></div><div class="metric green"><div class="k">Resultado econômico anual</div><div class="v">${BRL(result?.numeric_value)}</div><div class="d">Sobre receita anualizada de ${BRL(annual?.numeric_value)}.</div></div></div><div class="section"><header><div><h2>Memória do valuation</h2><p>Todos os indicadores da aba oficial de Valuation.</p></div></header><div class="section-body">${table([{label:'Indicador'},{label:'Fórmula / premissa'},{label:'Valor',money:true},{label:'Observação'}],v.map(x=>`<tr><td><strong>${S(x.indicator)}</strong></td><td>${S(x.formula_premise)}</td><td class="money">${BRL(x.numeric_value)}</td><td>${S(x.observation||'—')}</td></tr>`))}<div class="source-note">Valuation gerencial para planejamento. Não é laudo formal de avaliação de empresa.</div></div></div>`}
function officialPanel(){const o=data.official||{},ass=data.assumptions||[],costs=data.costs||[],p=data.products||[],sc=o.scenarios||[],proj=o.projection_monthly||[],roi=o.roi_monthly||[],val=o.valuation||[],kpi=o.dashboard_kpis||[],pay=o.dashboard_payback||[];return `<div class="source-box"><strong>FONTE OFICIAL · YM_Quadro_Financeiro_ROI_Valuation_COMPLETO.xlsx</strong><p>Aqui ficam as oito visões originais para conferência. A camada executiva não substitui a planilha; apenas reorganiza a leitura.</p></div><details class="sheet"><summary>Dashboard</summary><div class="sheet-body">${table([{label:'Indicador'},{label:'Valor',money:true},{label:'Unidade'}],kpi.map(x=>`<tr><td><strong>${S(x.label)}</strong></td><td class="money">${N(x.numeric_value).toLocaleString('pt-BR')}</td><td>${S(x.unit||'—')}</td></tr>`),'520px')}${table([{label:'Produto'},{label:'Contribuição/venda',money:true},{label:'Vendas p/ investimento',money:true}],pay.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money">${N(x.sales_to_recover_23000).toLocaleString('pt-BR')}</td></tr>`),'520px')}</div></details><details class="sheet"><summary>Premissas</summary><div class="sheet-body">${table([{label:'Premissa'},{label:'Categoria'},{label:'Valor',money:true},{label:'Unidade'},{label:'Fonte'}],ass.map(x=>`<tr><td><strong>${S(x.label)}</strong></td><td>${S(x.category)}</td><td class="money">${N(x.numeric_value).toLocaleString('pt-BR')}</td><td>${S(x.unit||'—')}</td><td>${S(x.source_note||'—')}</td></tr>`))}<div class="source-note">Custos mensais</div>${table([{label:'Item'},{label:'Tipo'},{label:'Mensal',money:true},{label:'Fonte / status'}],costs.map(x=>`<tr><td><strong>${S(x.item_name)}</strong></td><td>${S(x.cost_type)}</td><td class="money">${BRL(x.monthly_value)}</td><td>${S(x.status_source||'—')}</td></tr>`),'620px')}</div></details><details class="sheet"><summary>Produtos</summary><div class="sheet-body">${table([{label:'Produto'},{label:'Preço',money:true},{label:'Horas',money:true},{label:'Custo entrega',money:true},{label:'Contribuição',money:true},{label:'Margem',money:true}],p.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${BRL(x.reference_price)}</td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.delivery_cost)}</td><td class="money">${BRL(x.contribution_per_sale)}</td><td class="money">${PCT(x.margin)}</td></tr>`))}</div></details><details class="sheet"><summary>Capacidade</summary><div class="sheet-body">${table([{label:'Produto'},{label:'Horas/venda',money:true},{label:'Teórica/mês',money:true},{label:'Recomendada/mês',money:true},{label:'Receita potencial',money:true}],p.map(x=>`<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}</td><td class="money">${N(x.theoretical_capacity_month).toLocaleString('pt-BR')}</td><td class="money">${N(x.recommended_capacity_month).toLocaleString('pt-BR')}</td><td class="money">${BRL(x.revenue_recommended)}</td></tr>`))}</div></details><details class="sheet"><summary>Visão Geral</summary><div class="sheet-body">${table([{label:'Cenário'},{label:'Mix'},{label:'Receita',money:true},{label:'Resultado caixa',money:true},{label:'Resultado econômico',money:true},{label:'Capacidade'}],sc.map(x=>`<tr><td><strong>${S(x.scenario_name)}</strong></td><td>${S(x.mix_monthly)}</td><td class="money">${BRL(x.revenue)}</td><td class="money">${BRL(x.cash_result)}</td><td class="money">${BRL(x.economic_result)}</td><td>${S(x.capacity_status)}</td></tr>`))}</div></details><details class="sheet"><summary>Projeção Mensal</summary><div class="sheet-body">${table([{label:'Mês'},{label:'Receita planejada',money:true},{label:'Contribuição',money:true},{label:'Resultado caixa',money:true},{label:'Resultado econômico',money:true},{label:'Saldo a recuperar',money:true},{label:'Capacidade'}],proj.map(x=>`<tr><td><strong>${MONTH(x.month)}</strong></td><td class="money">${BRL(x.planned_revenue)}</td><td class="money">${BRL(x.product_contribution)}</td><td class="money">${BRL(x.cash_result)}</td><td class="money">${BRL(x.economic_result)}</td><td class="money">${BRL(x.historical_balance_to_recover)}</td><td>${S(x.status)}</td></tr>`))}</div></details><details class="sheet"><summary>ROI Mensal</summary><div class="sheet-body">${table([{label:'Mês'},{label:'Receita',money:true},{label:'Contribuição',money:true},{label:'Resultado econômico',money:true},{label:'Resultado acumulado',money:true},{label:'Saldo investimento',money:true},{label:'ROI acumulado',money:true}],roi.map(x=>`<tr><td><strong>${MONTH(x.month)}</strong></td><td class="money">${BRL(x.revenue)}</td><td class="money">${BRL(x.product_contribution)}</td><td class="money">${BRL(x.economic_result)}</td><td class="money">${BRL(x.accumulated_result)}</td><td class="money">${BRL(x.investment_balance)}</td><td class="money">${PCT(x.accumulated_roi)}</td></tr>`))}</div></details><details class="sheet"><summary>Valuation</summary><div class="sheet-body">${table([{label:'Indicador'},{label:'Fórmula / premissa'},{label:'Valor',money:true},{label:'Observação'}],val.map(x=>`<tr><td><strong>${S(x.indicator)}</strong></td><td>${S(x.formula_premise)}</td><td class="money">${BRL(x.numeric_value)}</td><td>${S(x.observation||'—')}</td></tr>`))}</div></details>`}
function render(){if(!data)return;const panel=state.tab==='executiva'?executive():state.tab==='produtos'?productsPanel():state.tab==='capacidade'?capacityPanel():state.tab==='planejamento'?planningPanel():state.tab==='valuation'?valuationPanel():officialPanel();$('app').innerHTML=`<div class="fin-status">ESTRUTURA DE LEITURA EM VALIDAÇÃO · números ainda não homologados</div>${tabs()}<section class="fin-panel active">${panel}</section>`;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=b.dataset.preset;if(p==='custom'){state.preset='custom';render()}else applyPreset(p)});const f=$('fromMonth'),t=$('toMonth');if(f)f.onchange=()=>{state.preset='custom';state.from=fromInput(f.value);if(state.from>state.to)state.to=state.from;render()};if(t)t.onchange=()=>{state.preset='custom';state.to=fromInput(t.value);if(state.to<state.from)state.from=state.to;render()}}
async function load(){try{data=await api();render()}catch(e){$('app').innerHTML=`<div class="ym-empty">${S(e.message)}</div>`;YM.toast(e.message,true)}}
$('refresh').onclick=load;load();
</script></body></html>
