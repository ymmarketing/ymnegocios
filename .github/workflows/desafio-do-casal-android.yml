name: Gerar APK Desafio do Casal

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "desafio-do-casal-android/**"
      - ".github/workflows/desafio-do-casal-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: desafio-do-casal-android

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Preparar símbolo oficial YM
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode ym_symbol.b64 > app/src/main/res/drawable-nodpi/ym_symbol.png

      - name: Gerar APK de teste
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Desafio-do-Casal-Android-v1.0.3-YM
          path: desafio-do-casal-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
