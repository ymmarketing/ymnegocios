name: Strip Raio-X legacy runtime
on:
  push:
    paths:
      - '.trigger-raiox-strip-legacy'
permissions:
  contents: write
jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy runtime scripts from paid entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('raio-x.html')
          s=p.read_text(encoding='utf-8')
          before=s
          for name in ('raiox-report-v1-1.js','raiox-v3.1-persist.js'):
              s=re.sub(r'<script[^>]+src=["\'][^"\']*'+re.escape(name)+r'[^"\']*["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
          if '/assets/js/raiox-v2-official-router.js' not in s:
              raise SystemExit('V2.2 router missing; abort')
          p.write_text(s,encoding='utf-8')
          print('removed bytes',len(before)-len(s))
          PY
      - name: Verify production runtime
        run: |
          ! grep -q 'raiox-report-v1-1.js' raio-x.html
          ! grep -q 'raiox-v3.1-persist.js' raio-x.html
          grep -q 'raiox-v2-official-router.js' raio-x.html
      - name: Commit
        run: |
          git config user.name 'YM Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add raio-x.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(raiox): remove legacy runtime scripts from paid flow'
          git push
