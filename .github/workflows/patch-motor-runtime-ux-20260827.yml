name: Patch MOTOR runtime UX 20260827
on:
  push:
    paths:
      - 'scripts/patch_motor_runtime_ux_20260827.py'
      - '.github/workflows/patch-motor-runtime-ux-20260827.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_motor_runtime_ux_20260827.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MOTOR/index.html
          git diff --cached --quiet && exit 0
          git commit -m "MOTOR: publica gate recolhível e IA do ORDENAR"
          git push
