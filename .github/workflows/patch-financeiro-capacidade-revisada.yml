name: Publicar capacidade revisada no Financeiro
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/patch-financeiro-capacidade-revisada.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar aba Capacidade
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p = Path('FINANCEIRO/index.html')
          s = p.read_text()
          b64 = ''
          replacement = base64.b64decode(b64).decode()
          pattern = r'function capacityPanel\(\)\{.*?\}\nfunction planningPanel'
          out, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'capacityPanel target not found: {n}')
          p.write_text(out)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINANCEIRO/index.html
          git commit -m 'Etapa 3: revisa capacidade para jornada de 200h e saldo vendável'
          git push
