name: UX responsive final 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux-responsive-final-20260826.yml'

permissions:
  contents: write

jobs:
  audit-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run responsive final audit
        run: python scripts/ux_responsive_final_20260826.py
      - name: Commit responsive fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'UX: finaliza responsividade e cache das telas ativas'
          git push
