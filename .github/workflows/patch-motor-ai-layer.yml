name: Patch MOTOR AI layer
on:
  push:
    paths:
      - '.github/workflows/patch-motor-ai-layer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach AI analysis layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('MOTOR/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/motor-ai-layer.js?v=20260814-1"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'</body></html>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MOTOR/index.html
          git diff --cached --quiet && exit 0
          git commit -m "MOTOR: ativa análise assistida por IA"
          git push
