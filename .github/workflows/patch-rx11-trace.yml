name: Finalize RX_REPORT_1.1 frontend
on:
  push:
    branches:
      - feat/rx-report-1-1-interpretativo-20260819
    paths:
      - '.github/workflows/patch-rx11-trace.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar estado final
        run: |
          node --check assets/js/raiox-report-v1-1.js
          python - <<'PY'
          from pathlib import Path
          js=Path('assets/js/raiox-report-v1-1.js').read_text(encoding='utf-8')
          assert '13 — Rastreabilidade' in js
          assert 'Resposta informada:' not in js
          for fp in ['raio-x.html','raio-x-v3.1-integrado.html']:
              s=Path(fp).read_text(encoding='utf-8')
              assert "report_version: 'RX_REPORT_1.1'" in s
              assert 'assets/js/raiox-report-v1-1.js' in s
          PY
      - name: Remover artefatos temporários de desenvolvimento
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/patch-raiox-report-v11.yml .github/workflows/patch-rx11-trace.yml docs/RX_REPORT_1_1_CHECK_OK.md
          git commit -m 'chore: remove artefatos temporários do RX_REPORT_1.1'
          git push
