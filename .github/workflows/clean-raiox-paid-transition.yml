name: Clean Raio-X paid transition
on:
  push:
    paths:
      - '.trigger-raiox-clean-transition'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy approved transition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/raiox-payment-shell-v1.js')
          s=p.read_text(encoding='utf-8')
          old="if (paymentStatus === 'approved') { stopPolling(); clearPaymentMessage(); hideContingency(); originalGo('quiz'); root.renderQuiz(); return true; }"
          new="if (paymentStatus === 'approved') { stopPolling(); clearPaymentMessage(); hideContingency(); root.location.replace('/raio-x-app.html?ref=' + encodeURIComponent(ref)); return true; }"
          if old in s:
              s=s.replace(old,new,1)
          if new not in s:
              raise SystemExit('approved production redirect missing')
          p.write_text(s,encoding='utf-8')
          print('approved flow points directly to V2.2')
          PY
      - name: Commit
        run: |
          git config user.name 'YM Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/raiox-payment-shell-v1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(raiox): remove legacy approved transition'
          git push
