name: Bump MOTOR ORDENAR AI cache v2

on:
  push:
    paths:
      - 'scripts/bump_motor_order_ai_cache_v2_20260827.py'
      - '.github/workflows/bump-motor-order-ai-cache-v2-20260827.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump cache
        run: python scripts/bump_motor_order_ai_cache_v2_20260827.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MOTOR/index.html
          git commit -m "MOTOR: publica versão final da IA no ORDENAR"
          git push
