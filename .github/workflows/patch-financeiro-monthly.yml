name: Corrigir tabela mensal do Financeiro
on:
  push:
    paths:
      - '.github/workflows/patch-financeiro-monthly.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch monthly filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('FINANCEIRO/index.html')
          s=p.read_text()
          old="(data.monthly||[]).filter(x=>String(x.month)<='${new Date(new Date().setMonth(new Date().getMonth()+3)).toISOString().slice(0,7)}-01').map"
          new="(data.monthly||[]).filter(x=>new Date(String(x.month)+'T12:00:00')<=new Date(new Date().getFullYear(),new Date().getMonth()+4,0)).map"
          if old not in s:
              raise SystemExit('monthly filter target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINANCEIRO/index.html
          git commit -m 'Etapa 3: corrige evolução mensal do Financeiro'
          git push
