name: Atualizar status do Financeiro
on:
  push:
    paths:
      - '.github/workflows/patch-financeiro-monthly.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar status da homologação
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('FINANCEIRO/index.html')
          s=p.read_text()
          old='ESTRUTURA DE LEITURA EM VALIDAÇÃO · números ainda não homologados'
          new='ARQUITETURA VALIDADA · dados atualizados para conferência'
          if old not in s:
              raise SystemExit('status target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINANCEIRO/index.html
          git commit -m 'Etapa 3: atualiza status da homologação financeira'
          git push
