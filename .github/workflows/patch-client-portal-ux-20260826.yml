name: Patch Área do Cliente UX 20260826
on:
  push:
    paths:
      - 'scripts/patch_client_portal_ux_20260826.py'
      - '.github/workflows/patch-client-portal-ux-20260826.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correções
        run: python scripts/patch_client_portal_ux_20260826.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/client-portal.js assets/client-portal-experience.js assets/client-performance-portal.js areadocliente/index.html areadocliente/redefinir/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Área do Cliente: isola sessão e corrige navegação'
          git push
