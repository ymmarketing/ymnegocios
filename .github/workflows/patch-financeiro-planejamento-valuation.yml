name: Publicar planejamento e valuation revisados
'on':
  push:
    paths:
      - '.github/workflows/patch-financeiro-planejamento-valuation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar Planejamento e Valuation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('FINANCEIRO/index.html')
          s=p.read_text()
          planning=r'''function planningPanel(){const a=aggregates(),ms=data.planning?.milestones||[];const cards=ms.map(x=>{const tone=x.milestone_code==='TARGET_15K'?'indigo':x.milestone_code==='MATURITY_20K'?'green':'';return `<div class="metric ${tone}"><div class="k">${S(x.label)}</div><div class="v">${BRL(x.target_revenue)}</div><div class="d">Cenário: ${BRL(x.estimated_revenue)} · ${PCT100(x.capacity_occupancy_pct)} ocupada · resultado econômico ${BRL(x.economic_result_month)}/mês.</div></div>`}).join('');const target=ms.find(x=>x.milestone_code==='TARGET_15K')||{},maturity=ms.find(x=>x.milestone_code==='MATURITY_20K')||{};const rows=a.keys.map(k=>{const x=a.aset.get(k)||{},p=a.pset.get(k)||{};return `<tr><td><strong>${MONTH(k)}</strong></td><td class="money">${BRL(p.planned_revenue)}</td><td class="money">${BRL(x.contratado)}</td><td class="money">${BRL(x.faturado)}</td><td class="money"><strong>${BRL(x.recebido)}</strong></td><td class="money">${BRL(Math.max(N(data.summary?.monthly_revenue_target)-N(x.recebido),0))}</td><td>${S(p.status||'—')}</td></tr>`});const mixCards=ms.map(x=>`<div class="scenario"><h3>${S(x.label)} · ${BRL(x.estimated_revenue)}</h3><p>${x.mix.map(i=>`${N(i.units)}× ${S(i.service_name)}`).join(' · ')}</p><div class="minirow"><span>Horas de clientes</span><b>${N(x.estimated_hours).toLocaleString('pt-BR')}h</b></div><div class="minirow"><span>Ocupação segura</span><b>${PCT100(x.capacity_occupancy_pct)}</b></div><div class="minirow"><span>Resultado econômico/mês</span><b>${BRL(x.economic_result_month)}</b></div></div>`).join('');return `${filterBox()}<div class="section-title">Planejamento</div><p class="section-lead">A notícia agora é simples: R$ 10 mil é piso, R$ 15 mil é a meta operacional e R$ 20 mil é a maturidade da estrutura atual.</p><div class="metric-grid">${cards}</div><div class="section"><header><div><h2>Leitura executiva</h2><p>Quanto a estrutura consegue monetizar sem virar gargalo de entrega.</p></div>${badge('META R$ 15 MIL','ok')}</header><div class="section-body"><div class="period-summary"><div class="summary-card emphasis"><strong>${BRL(target.estimated_revenue)} com ${PCT100(target.capacity_occupancy_pct)} de ocupação</strong><span>A meta operacional ainda deixa cerca de ${(N(data.summary?.safe_delivery_hours)-N(target.estimated_hours)).toLocaleString('pt-BR')}h seguras livres no mês.</span></div><div class="summary-card"><strong>${BRL(maturity.estimated_revenue)} com ${PCT100(maturity.capacity_occupancy_pct)} de ocupação</strong><span>O patamar de maturidade continua dentro da faixa saudável da capacidade atual.</span></div></div></div></div><div class="section"><header><div><h2>Mix de referência</h2><p>Não é obrigação de venda; é uma simulação concreta para provar que os patamares cabem em horas e economia.</p></div></header><div class="section-body"><div class="scenario-grid">${mixCards}</div></div></div><div class="section"><header><div><h2>Mês a mês</h2><p>Previsto ≠ contratado ≠ faturado ≠ recebido.</p></div></header><div class="section-body">${table([{label:'Mês'},{label:'Plano oficial',money:true},{label:'Contratado',money:true},{label:'Faturado',money:true},{label:'Recebido',money:true},{label:'Gap meta',money:true},{label:'Capacidade'}],rows)}</div></div>`}'''
          valuation=r'''function valuationPanel(){const ms=data.planning?.milestones||[],run=data.planning?.current_recurring_run_rate||{},target=ms.find(x=>x.milestone_code==='TARGET_15K')||{},maturity=ms.find(x=>x.milestone_code==='MATURITY_20K')||{},v=data.official?.valuation||[],floor=(v.find(x=>x.metric_key==='INTELLECTUAL_ASSET_FLOOR')||{}).numeric_value;const currentSupported=N(run.economic_result_month)>0;return `<div class="section-title">Valuation</div><p class="section-lead">O valuation agora acompanha a capacidade real de gerar resultado. A margem fixa de 50% saiu do cálculo principal.</p><div class="metric-grid"><div class="metric ${currentSupported?'green':'orange'}"><div class="k">Run-rate recorrente atual</div><div class="v">${currentSupported?BRL(run.valuation_low)+'–'+BRL(run.valuation_high):'Ainda não sustentado'}</div><div class="d">Receita recorrente ${BRL(run.revenue)} · resultado econômico ${BRL(run.economic_result_month)}/mês.</div></div><div class="metric indigo"><div class="k">Na meta operacional · ~R$ 15k</div><div class="v">${BRL(target.valuation_low)}–${BRL(target.valuation_high)}</div><div class="d">Resultado econômico anual estimado: ${BRL(target.economic_result_year)}.</div></div><div class="metric dark"><div class="k">Na maturidade · R$ 20k</div><div class="v">${BRL(maturity.valuation_low)}–${BRL(maturity.valuation_high)}</div><div class="d">Resultado econômico anual estimado: ${BRL(maturity.economic_result_year)}.</div></div><div class="metric"><div class="k">Ativo intelectual / reposição</div><div class="v">${BRL(floor)}</div><div class="d">Referência de investimento intelectual; não é piso de valuation de mercado.</div></div></div><div class="section"><header><div><h2>A notícia do valuation</h2><p>O valor de R$ 120–180 mil deixa de ser associado a R$ 10 mil de receita.</p></div>${badge('FÓRMULA REVISADA','ok')}</header><div class="section-body"><div class="period-summary"><div class="summary-card emphasis"><strong>R$ 10 mil é piso econômico, não tese de valuation.</strong><span>Com a estrutura atual, o cenário de ~R$ 15 mil já produz resultado econômico positivo, mas ainda sustenta uma faixa menor de valuation.</span></div><div class="summary-card"><strong>R$ 20 mil aproxima a YM da faixa antes projetada.</strong><span>No mix de maturidade, o cálculo por earnings indica aproximadamente ${BRL(maturity.valuation_low)} a ${BRL(maturity.valuation_high)}.</span></div></div></div></div><div class="section"><header><div><h2>Como estamos calculando</h2><p>Receita → contribuição real do mix → custos fixos → 40h comercial → 20h gestão → resultado econômico anual → múltiplos 2x–3x.</p></div></header><div class="section-body">${table([{label:'Marco'},{label:'Receita cenário',money:true},{label:'Ocupação',money:true},{label:'Resultado econômico/mês',money:true},{label:'Resultado anual',money:true},{label:'Valuation 2x',money:true},{label:'Valuation 3x',money:true}],ms.map(x=>`<tr><td><strong>${S(x.label)}</strong></td><td class="money">${BRL(x.estimated_revenue)}</td><td class="money">${PCT100(x.capacity_occupancy_pct)}</td><td class="money">${BRL(x.economic_result_month)}</td><td class="money">${BRL(x.economic_result_year)}</td><td class="money">${BRL(x.valuation_low)}</td><td class="money">${BRL(x.valuation_high)}</td></tr>`))}<div class="source-note">Valuation gerencial para decisão interna. Não é laudo formal nem preço garantido de venda da empresa.</div></div></div>`}'''
          s,n1=re.subn(r'function planningPanel\(\)\{.*?\}\nfunction valuationPanel',planning+'\nfunction valuationPanel',s,count=1,flags=re.S)
          s,n2=re.subn(r'function valuationPanel\(\)\{.*?\}\nfunction officialPanel',valuation+'\nfunction officialPanel',s,count=1,flags=re.S)
          s=s.replace("const foundationCards=foundations.map(x=>{const q=N(x.available_new_sales_capacity);","const slots=Math.max(0,10-commitments.length);const foundationCards=foundations.map(x=>{const q=Math.min(N(x.available_new_sales_capacity),slots);")
          if n1!=1 or n2!=1: raise SystemExit(f'targets not found planning={n1} valuation={n2}')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINANCEIRO/index.html
          git commit -m 'Etapa 3: revisa planejamento 10-15-20 e valuation por resultado econômico'
          git push
