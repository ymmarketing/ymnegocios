name: Publicar termômetro executivo da Capacidade
on:
  push:
    paths:
      - '.github/workflows/patch-financeiro-capacidade-termometro.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar leitura executiva da capacidade
        run: python scripts/patch_financeiro_capacity_thermometer.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINANCEIRO/index.html
          git commit -m 'Etapa 3: adiciona termômetro e notícia executiva de capacidade'
          git push
