name: Publicar termômetro executivo da Capacidade
on:
  push:
    paths:
      - '.github/workflows/patch-financeiro-capacidade-termometro.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar leitura executiva da capacidade
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('FINANCEIRO/index.html')
          s=p.read_text()

          new_api=r'''async function api(){const s=await YM.requireSession('/FINANCEIRO');if(!s)throw new Error('Sessão necessária');const headers={Authorization:'Bearer '+s.access_token,apikey:YM.PUBLISHABLE_KEY};const [r,dr]=await Promise.all([fetch(YM.SUPABASE_URL+'/functions/v1/finance-dashboard',{headers}),fetch(YM.SUPABASE_URL+'/functions/v1/motor-dashboard?period=ALL',{headers})]);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha no Financeiro');const dj=await dr.json().catch(()=>({}));j.commercial_snapshot=dr.ok?(dj.commercial?.funnel||null):null;return j}'''
          s,n=re.subn(r"async function api\(\)\{.*?return j\}",new_api,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'api target not found: {n}')

          new_capacity=r'''function capacityPanel(){const s=data.summary||{},p=data.products||[],commitments=data.capacity_commitments||[],cur=data.current_month||{},f=data.commercial_snapshot||{};const safe=N(s.safe_delivery_hours||s.vendable_hours),committed=N(s.committed_hours),available=N(s.available_new_sales_hours),occupancy=N(s.capacity_occupancy_pct),freePct=Math.max(0,100-occupancy),target=N(s.monthly_revenue_target),contracted=N(cur.contratado),salesGap=Math.max(0,target-contracted),commercial=N(s.commercial_hours);const band=occupancy<40?'MUITO LIVRE':occupancy<65?'LIVRE':occupancy<80?'SAUDÁVEL':occupancy<90?'ALTA':'SATURADA';const bandNote=occupancy<40?'Seu gargalo hoje não é capacidade de entrega. Há espaço relevante para colocar novos clientes na agenda.':occupancy<65?'Ainda há espaço confortável para crescer sem pressionar a operação.':occupancy<80?'A agenda está em uma faixa saudável; novas vendas precisam começar a considerar o mix de produtos.':occupancy<90?'A capacidade está alta. Novas vendas precisam ser escolhidas com atenção ao esforço de entrega.':'A operação está próxima do limite seguro; vender mais exige redistribuição ou ganho de capacidade.';const foundations=p.filter(x=>['FUNDACAO_ESSENCIAL','FUNDACAO_3_MESES','FUNDACAO_6_MESES'].includes(String(x.service_code)));const foundationCards=foundations.map(x=>{const q=N(x.available_new_sales_capacity);return `<div class="insight"><div class="tag">SE TODO O SALDO FOSSE ESTE PRODUTO</div><strong>${q} ${S(x.service_name)}</strong><span>${N(x.human_hours).toLocaleString('pt-BR')}h por cliente · ${BRL(q*N(x.reference_price))} de receita equivalente. Não é meta; é capacidade máxima comparativa.</span></div>`}).join('');const essential=foundations.find(x=>String(x.service_code)==='FUNDACAO_ESSENCIAL');const essentialPrice=N(essential?.reference_price),essentialHours=N(essential?.human_hours),essentialToGap=essentialPrice>0?Math.ceil(salesGap/essentialPrice):0,gapHours=essentialToGap*essentialHours;const commercialStatus=salesGap<=0?'META CONTRATADA':occupancy<65?'MANTER 40H E ACELERAR CONVERSÃO':'PROTEGER ENTREGA';const commercialMessage=salesGap<=0?'A meta mensal já está coberta por contratos. O foco comercial pode migrar para os próximos meses.':occupancy<65?`Hoje faltam ${BRL(salesGap)} em contratos para a meta. Isso equivale a ${essentialToGap} Fundação${essentialToGap===1?'':'ões'} Essencial${essentialToGap===1?'':'is'} (${gapHours.toLocaleString('pt-BR')}h de entrega). Como há ${available.toLocaleString('pt-BR')}h livres, eu não aumentaria as ${commercial.toLocaleString('pt-BR')}h de prospecção agora; usaria melhor essas horas para fazer o funil avançar.`:'Antes de aumentar prospecção, proteja a capacidade de entrega e priorize tickets/margens melhores.';const funnelLine=N(f.total)>0?`O funil registra ${N(f.total)} oportunidades no histórico: ${N(f.reading_sent)} chegaram a leitura enviada, ${N(f.raiox_paid)} a Raio-X pago e ${N(f.won)} a ganho. Isso ajuda a separar falta de leads de falta de avanço no funil.`:'Ainda não há leitura comercial suficiente do funil para estimar conversão por hora de prospecção.';const commitmentCards=commitments.map(x=>`<div class="scenario"><h3>${S(x.business_name)}</h3><p>${S(x.basis_label||'Estimativa operacional')}</p><div class="minirow"><span>Horas/mês estimadas</span><b>${N(x.estimated_hours_month).toLocaleString('pt-BR')}h</b></div><div class="minirow"><span>Status</span><b>${S(x.estimation_status)}</b></div></div>`).join('');return `<div class="section-title">Capacidade</div><p class="section-lead">A primeira pergunta agora é: estou cheia ou ainda cabe negócio?</p><div class="hero"><div class="hero-eyebrow">TERMÔMETRO DE OCUPAÇÃO ATUAL</div><h2>${band}: hoje você usa ${occupancy.toLocaleString('pt-BR',{maximumFractionDigits:1})}% da sua capacidade segura.</h2><div class="hero-value">${freePct.toLocaleString('pt-BR',{maximumFractionDigits:1})}% livre</div><div class="hero-label">${committed.toLocaleString('pt-BR')}h comprometidas de ${safe.toLocaleString('pt-BR')}h seguras para clientes.</div><div class="hero-progress"><span style="width:${Math.min(100,occupancy)}%"></span></div><div class="hero-progress-label">Ocupação: ${occupancy.toLocaleString('pt-BR',{maximumFractionDigits:1})}% · Livre: ${freePct.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</div><div class="hero-metrics"><div class="hero-metric"><span>CLIENTES RECORRENTES SIMULADOS</span><b>${commitments.length}</b></div><div class="hero-metric"><span>HORAS AINDA VENDÁVEIS</span><b>${available.toLocaleString('pt-BR')}h</b></div><div class="hero-metric"><span>GAP COMERCIAL DO MÊS</span><b>${BRL(salesGap)}</b></div></div><div class="hero-note">${bandNote}</div></div><div class="section"><header><div><h2>O que isso significa em clientes?</h2><p>Transformamos o saldo de horas em equivalência de carteira para você enxergar tamanho, não apenas tempo.</p></div>${badge(`${freePct.toLocaleString('pt-BR',{maximumFractionDigits:0})}% livre`,freePct>=35?'ok':freePct>=15?'warn':'bad')}</header><div class="section-body"><div class="insight-grid">${foundationCards}</div></div></div><div class="section"><header><div><h2>Notícia comercial do mês</h2><p>Capacidade disponível × meta financeira × esforço de prospecção.</p></div>${badge(commercialStatus,salesGap<=0?'ok':occupancy<65?'warn':'neutral')}</header><div class="section-body"><div class="period-summary"><div class="summary-card emphasis"><strong>${commercialMessage}</strong><span>${funnelLine}</span></div><div class="summary-card"><strong>${commercial.toLocaleString('pt-BR')}h/mês de prospecção</strong><span>Equivale a cerca de ${(commercial/20).toLocaleString('pt-BR',{maximumFractionDigits:1})}h por dia útil. Antes de aumentar essa reserva, precisamos medir quantas conversas, diagnósticos e vendas essas horas geram.</span></div></div></div></div><div class="section"><header><div><h2>Como as 200h estão distribuídas</h2><p>Detalhamento que explica o termômetro acima.</p></div></header><div class="section-body"><div class="metric-grid"><div class="metric dark"><div class="k">Jornada mensal</div><div class="v">${N(s.total_hours||s.productive_hours).toLocaleString('pt-BR')}h</div><div class="d">Capacidade bruta.</div></div><div class="metric"><div class="k">Prospecção / comercial</div><div class="v">${commercial.toLocaleString('pt-BR')}h</div><div class="d">Reserva comercial atual.</div></div><div class="metric"><div class="k">Gestão interna</div><div class="v">${N(s.management_hours).toLocaleString('pt-BR')}h</div><div class="d">Financeiro, CRM e gestão.</div></div><div class="metric indigo"><div class="k">Capacidade segura</div><div class="v">${safe.toLocaleString('pt-BR')}h</div><div class="d">Após gestão, comercial e reserva.</div></div><div class="metric orange"><div class="k">Já comprometidas</div><div class="v">${committed.toLocaleString('pt-BR')}h</div><div class="d">Clientes recorrentes estimados.</div></div><div class="metric green"><div class="k">Livres para novas vendas</div><div class="v">${available.toLocaleString('pt-BR')}h</div><div class="d">Saldo atual.</div></div></div></div></div><div class="section"><header><div><h2>Clientes já comprometidos</h2><p>Estimativas iniciais até medirmos o tempo real.</p></div>${badge('ESTIMADO','warn')}</header><div class="section-body"><div class="scenario-grid">${commitmentCards}</div></div></div><div class="section"><header><div><h2>Equivalência completa por produto</h2><p>Referência de peso operacional. Não representa uma meta de vendas.</p></div></header><div class="section-body">${table([{label:'Produto'},{label:'Horas/venda',money:true},{label:'Com saldo atual',money:true},{label:'Receita equivalente',money:true}],p.map(x=>{const q=N(x.available_new_sales_capacity);return `<tr><td><strong>${S(x.service_name)}</strong></td><td class="money">${N(x.human_hours).toLocaleString('pt-BR')}h</td><td class="money"><strong>${q.toLocaleString('pt-BR')}</strong></td><td class="money">${BRL(q*N(x.reference_price))}</td></tr>`}))}</div></div>`}
function planningPanel'''
          s,n=re.subn(r'function capacityPanel\(\)\{.*?\}\nfunction planningPanel',new_capacity,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'capacity target not found: {n}')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINANCEIRO/index.html
          git commit -m 'Etapa 3: adiciona termômetro e notícia executiva de capacidade'
          git push
