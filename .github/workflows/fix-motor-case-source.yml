name: Fix MOTOR case source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-motor-case-source.yml'

permissions:
  contents: write

jobs:
  patch-motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point MOTOR to dedicated case list endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MOTOR/index.html')
          s = p.read_text()
          old = "authFetch('motor-dashboard')"
          new = "authFetch('motor-cases')"
          if old not in s:
              print('MOTOR already patched')
          else:
              p.write_text(s.replace(old, new, 1))
              print('MOTOR patched')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "ymmarketing-bot"
          git config user.email "ymmarketing@users.noreply.github.com"
          git add MOTOR/index.html
          git commit -m "fix: restore MOTOR case list after dashboard split"
          git push origin main
