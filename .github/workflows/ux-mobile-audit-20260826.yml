name: UX mobile audit 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux-mobile-audit-20260826.yml'

permissions:
  contents: write

jobs:
  audit-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run mobile audit and patch
        run: python scripts/ux_mobile_audit_20260826.py
      - name: Commit mobile audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/internal-mobile-system.css assets/client-portal-mobile-system.css assets/quemsomos-mobile-system.css docs/ux-mobile-audit-20260826.md
          git add -A -- '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'UX: padroniza experiência mobile em todo ecossistema'
          git push
