name: MOTOR manual AI only 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-motor-auto-ai-20260827.yml'
      - 'scripts/disable_motor_auto_ai_20260827.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable automatic AI layer
        run: python scripts/disable_motor_auto_ai_20260827.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MOTOR/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MOTOR: usa somente análise assistida manual'
          git push
