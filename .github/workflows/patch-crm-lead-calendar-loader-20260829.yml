name: Publicar agenda de leads no CRM
on:
  push:
    paths:
      - 'scripts/patch_crm_lead_calendar_loader_20260829.py'
      - '.github/workflows/patch-crm-lead-calendar-loader-20260829.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar carregadores do CRM
        run: python scripts/patch_crm_lead_calendar_loader_20260829.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/internal-shell.js CRM/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'CRM: publica agenda de reuniões para leads'
          git push
