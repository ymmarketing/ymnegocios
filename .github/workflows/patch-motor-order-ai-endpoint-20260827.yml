name: Patch MOTOR ORDENAR AI endpoint

on:
  push:
    paths:
      - 'scripts/patch_motor_order_ai_endpoint_20260827.py'
      - '.github/workflows/patch-motor-order-ai-endpoint-20260827.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Point ORDENAR AI to existing endpoint
        run: python scripts/patch_motor_order_ai_endpoint_20260827.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/motor-flow-v2.js
          git commit -m "MOTOR: usa endpoint consolidado para IA do ORDENAR"
          git push
