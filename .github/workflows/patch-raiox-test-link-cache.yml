name: Atualizar cache do link de teste do Raio-X
on:
  push:
    paths:
      - '.github/workflows/patch-raiox-test-link-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar versão do script de persistência
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('raio-x.html')
          s=p.read_text()
          old='assets/js/raiox-v3.1-persist.js?v=20260820-0947'
          new='assets/js/raiox-v3.1-persist.js?v=20260821-1702'
          if old not in s:
              raise SystemExit('script target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raio-x.html
          git commit -m 'Raio-X: atualiza bootstrap do acesso de teste'
          git push
