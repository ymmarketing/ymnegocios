name: Publicar acessos rápidos no index
on:
  push:
    paths:
      - 'scripts/patch_index_quick_access.py'
      - '.github/workflows/patch-index-quick-access.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar acessos rápidos
        run: python scripts/patch_index_quick_access.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/home-v3.css
          git diff --cached --quiet && exit 0
          git commit -m 'Site: adiciona Acesso interno, Área do cliente e Quem somos'
          git push
