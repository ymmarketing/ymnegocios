<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Raio-X Estratégico — Teste de execução</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#F7F8FC;color:#0B1533}main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{width:min(520px,100%);background:#fff;border:1px solid #E4E8F1;border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(18,30,74,.10);text-align:center}.spin{width:42px;height:42px;border:4px solid #EEF1FF;border-top-color:#FF7A00;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:20px;margin:0 0 8px}p{font-size:14px;line-height:1.55;color:#68748E;margin:0}.err{display:none;margin-top:16px;padding:12px;border-radius:12px;background:#FFF1EF;color:#9B2F2B;font-size:13px}
</style>
</head>
<body>
<main><div class="box"><div class="spin"></div><h1>Abrindo o questionário do Raio-X</h1><p>Este é um teste de execução. A cobrança foi ignorada e o fluxo oficial será aberto diretamente.</p><div id="err" class="err"></div></div></main>
<script>
(async()=>{
  const err=document.getElementById('err');
  try{
    const p=new URLSearchParams(location.search);
    const token=p.get('token');
    if(!token) throw new Error('Link de teste inválido.');
    try{localStorage.removeItem('ym_raiox_ref');localStorage.removeItem('rx_draft_v1')}catch(e){}
    const r=await fetch('https://ym-raiox-backend.vercel.app/api/acesso/teste',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok||!d.ref||d.status!=='approved') throw new Error(d.error||'Não foi possível liberar o teste.');
    try{localStorage.setItem('ym_raiox_ref',d.ref)}catch(e){}
    location.replace('/raio-x.html?ref='+encodeURIComponent(d.ref));
  }catch(e){err.style.display='block';err.textContent=e.message||'Falha ao abrir o teste.'}
})();
</script>
</body>
</html>
