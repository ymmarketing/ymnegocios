function uxConf(v){return String(v||'').replaceAll('_',' ')}
function uxScoreLabel(v){v=Number(v)||0;if(v<3)return'Crítico';if(v<5)return'Em construção';if(v<7)return'Funcional';if(v<8.5)return'Estruturado';return'Consolidado'}
function uxTone(v){v=Number(v)||0;if(v<4)return'critical';if(v<6)return'attention';if(v<8)return'good';return'strong'}
function uxColor(v){const t=uxTone(v);return t==='critical'?'#B42318':t==='attention'?'#D9821B':t==='strong'?'#067A55':'#0066FF'}
function uxPct(v){return Math.max(0,Math.min(100,(Number(v)||0)*10))}
function uxSym(name){const n=String(name||'').toLowerCase();if(/oferta|clareza|posicion/.test(n))return'◎';if(/conte[uú]do|frequ/.test(n))return'▦';if(/capta|funil|convers/.test(n))return'↗';if(/identidade|visual|marca/.test(n))return'◇';if(/prova|reputa|avalia/.test(n))return'★';if(/autoridade|confian/.test(n))return'✓';if(/seo|google|local|descob/.test(n))return'⌕';if(/relacion|comercial|follow/.test(n))return'↻';if(/opera|sustenta|process/.test(n))return'⚙';return'◆'}
function uxJourneySym(stage){return({'Encontrar':'⌕','Entender':'◉','Confiar':'✓','Contatar':'↗','Comprar':'◆','Continuar':'↻'})[stage]||'•'}
function uxHead(icon,title,desc){return '<div class="sectionHead"><span class="sectionIcon">'+icon+'</span><div><h2>'+esc(title)+'</h2><p>'+esc(desc)+'</p></div></div>'}
function uxDetail(label,text){if(!text)return'';return '<button type="button" class="detailToggleUx">+ '+esc(label)+'</button><div class="detailBodyUx">'+esc(text)+'</div>'}
function uxBind(){document.querySelectorAll('.detailToggleUx').forEach(b=>b.onclick=()=>{const d=b.nextElementSibling,o=d.classList.toggle('open');b.textContent=(o?'− ':'+ ')+b.textContent.replace(/^[+−]\\s*/,'')})}

h+='<section class="card rsec">'+uxHead('◎','O que priorizar','Até três movimentos — porque se tudo for prioridade, nada é prioridade.')+'<div class="priorityGridUx">'+prios.map(x=>'<article class="prioUx"><div class="prioNumUx">0'+x.order+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.why)+'</p><div class="metricChipsUx"><span class="metricChipUx">impacto '+esc(x.impact)+'</span><span class="metricChipUx">esforço '+esc(x.effort)+'</span><span class="metricChipUx">confiança '+esc(uxConf(x.confidence))+'</span></div></article>').join('')+'</div></section>';
