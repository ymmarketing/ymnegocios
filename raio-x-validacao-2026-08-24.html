  .uxConnections .item,.uxFindings .item{border:1px solid #E2E8F1!important;border-radius:15px!important;padding:17px!important;margin-top:12px!important;background:#fff!important}.uxConnections .item h3,.uxFindings .item h3{font-size:15px!important}.uxConnections .item p{font-size:12px;line-height:1.55}.uxConnections .item p:first-of-type{display:none}.uxToggle{border:0;background:none;color:#0066FF;font-weight:700;font-size:11px;padding:7px 0 0;cursor:pointer}.uxHidden{display:none!important}.uxShown{display:block!important}.uxConnections .sources,.uxFindings .sources{margin-top:9px!important}

  const ENHANCE=`(function(){
    function tone(n){n=Number(n)||0;return n<4?'critical':n<6?'attention':n<8?'good':'strong'}
    function color(n){return tone(n)==='critical'?'#B42318':tone(n)==='attention'?'#D9821B':tone(n)==='good'?'#0066FF':'#067A55'}
    function label(n){n=Number(n)||0;return n<4?'Crítico':n<6?'Atenção':n<8?'Bom':'Forte'}
    function icon(name){name=String(name||'').toLowerCase();if(/oferta|posicion|clareza/.test(name))return '◎';if(/conteúdo|conteudo|frequ/.test(name))return '▤';if(/capta|convers|funil|jornada/.test(name))return '↗';if(/identidade|visual|marca/.test(name))return '◇';if(/prova|reputa|avalia/.test(name))return '★';if(/autoridade|confian/.test(name))return '✓';if(/seo|google|local|descob/.test(name))return '⌕';if(/relacion|comercial|follow/.test(name))return '↻';if(/opera|sustenta|process/.test(name))return '⚙';return '◆'}
    const jicons=['⌕','◉','✓','↗','◆','↻'];
    function setup(){
      const report=document.getElementById('report');if(!report||getComputedStyle(report).display==='none')return;
      const ov=document.querySelector('.overall');if(ov&&!ov.dataset.ux){const n=parseFloat((ov.querySelector('strong')?.textContent||'0').replace(',','.'))||0;ov.dataset.ux='1';ov.style.setProperty('--tone',color(n));ov.style.setProperty('--pct',Math.max(0,Math.min(100,n*10)));const band=ov.querySelector('.band');if(band)band.textContent=label(n)}
      const secs=[...document.querySelectorAll('.rsec')];secs.forEach(s=>{const t=(s.querySelector('h2')?.textContent||'').toLowerCase();if(t.includes('painel de saúde'))s.classList.add('uxScores');else if(t.includes('nos levou'))s.classList.add('uxConnections');else if(t.includes('jornada hoje'))s.classList.add('uxJourney');else if(t.includes('principais achados'))s.classList.add('uxFindings');else if(t.includes('leitura por frentes'))s.classList.add('uxFronts');else if(t.includes('priorizar'))s.classList.add('uxPriorities');else if(t.includes('90 dias'))s.classList.add('uxTimeline');else if(t.includes('não podemos'))s.classList.add('uxTransparency');else if(t.includes('principal agora'))s.classList.add('uxClosing')});
      document.querySelectorAll('.scorecard').forEach(c=>{if(c.dataset.ux)return;c.dataset.ux='1';const n=parseFloat((c.querySelector('.scorevalue')?.textContent||'0').replace(',','.'))||0;c.dataset.tone=tone(n);const h=c.querySelector('.scorehead h3');if(h){const sp=document.createElement('span');sp.className='uxScoreIcon';sp.textContent=icon(h.textContent);c.querySelector('.scorehead').insertBefore(sp,h)}const meta=c.querySelector('.scoremeta');if(meta){const conf=(meta.textContent.split('·')[1]||'').trim();meta.innerHTML='<span class="uxBand">'+label(n)+'</span><span>'+conf+'</span>'}});
      const scoreSec=document.querySelector('.uxScores');if(scoreSec&&!scoreSec.querySelector('.uxLegend')){const l=document.createElement('div');l.className='uxLegend';l.innerHTML='<span><i class="uxDot red"></i>0–3,9 · crítico</span><span><i class="uxDot amber"></i>4–5,9 · atenção</span><span><i class="uxDot blue"></i>6–7,9 · bom</span><span><i class="uxDot green"></i>8–10 · forte</span><span>O score geral consolida os seis indicadores.</span>';scoreSec.appendChild(l)}
      document.querySelectorAll('.j').forEach((j,i)=>{if(j.dataset.ux)return;j.dataset.ux='1';const x=document.createElement('span');x.className='uxJourneyIcon';x.textContent=jicons[i]||'•';j.insertBefore(x,j.firstChild)});
      document.querySelectorAll('.uxConnections .item').forEach(it=>{if(it.dataset.ux)return;it.dataset.ux='1';const p=it.querySelector('p');if(p){p.classList.add('uxHidden');const b=document.createElement('button');b.type='button';b.className='uxToggle';b.textContent='+ Ver evidência observada';b.onclick=()=>{const open=p.classList.toggle('uxShown');b.textContent=(open?'− Ocultar':' + Ver evidência observada').replace(/^ /,'')};p.after(b)}});
      document.querySelectorAll('.uxFindings .item').forEach(it=>{const st=(it.querySelector('.step')?.textContent||'').toLowerCase();if(st.includes('prioridade alta'))it.dataset.priority='alta';else if(st.includes('prioridade baixa'))it.dataset.priority='baixa';else it.dataset.priority='media'});
      document.querySelectorAll('.uxFronts .front').forEach(f=>{if(f.dataset.ux)return;f.dataset.ux='1';const ps=f.querySelectorAll('p');const last=ps[ps.length-1];if(last){last.classList.add('uxHidden');const b=document.createElement('button');b.type='button';b.className='uxToggle';b.textContent='+ Ver leitura completa';b.onclick=()=>{const open=last.classList.toggle('uxShown');b.textContent=open?'− Ocultar leitura':'+ Ver leitura completa'};f.appendChild(b)}});
      document.querySelectorAll('.uxPriorities .prio').forEach((p,i)=>p.dataset.num='0'+(i+1));
    }
    const mo=new MutationObserver(()=>setup());mo.observe(document.body,{childList:true,subtree:true});setup();setInterval(setup,1200);
  })();`;
  try{
    const r=await fetch(BASE,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html.replace('</head>','<style>'+CSS+'</style></head>');
    html=html.replace('</body>','<script>'+ENHANCE+'</scr'+'ipt></body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="load"><b>Não foi possível carregar a validação.</b><br><small>'+String(e.message||e)+'</small></div>'}
})();
